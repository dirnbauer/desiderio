name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-analysis:
    name: PHPStan + audit (PHP ${{ matrix.php-version }} · TYPO3 ${{ matrix.typo3-version }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        php-version: ["8.4", "8.5"]
        typo3-version: ["^14.3.6"]
    steps:
      - uses: actions/checkout@v5

      - name: Set up PHP ${{ matrix.php-version }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          tools: composer:v2
          coverage: none

      - name: Cache composer dependencies
        uses: actions/cache@v6
        with:
          path: ~/.cache/composer
          key: composer-${{ matrix.php-version }}-${{ matrix.typo3-version }}-${{ hashFiles('composer.json') }}

      - name: Pin TYPO3 version (${{ matrix.typo3-version }})
        run: composer require --no-update --no-interaction "typo3/cms-core:${{ matrix.typo3-version }}" "typo3/cms-fluid:${{ matrix.typo3-version }}" "typo3/cms-workspaces:${{ matrix.typo3-version }}"

      - name: Install
        run: composer update --no-interaction --no-progress --prefer-dist

      - name: Validate composer.json
        run: composer validate --strict --no-check-publish

      - name: Audit composer dependencies
        run: composer audit --no-dev --abandoned=fail

      - name: Check coding standards
        run: vendor/bin/php-cs-fixer fix --dry-run --diff

      - name: Run PHPStan (level 8)
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=2G

  unit-tests:
    name: PHPUnit (PHP ${{ matrix.php-version }} · TYPO3 ${{ matrix.typo3-version }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        php-version: ["8.4", "8.5"]
        typo3-version: ["^14.3.6"]
    steps:
      - uses: actions/checkout@v5

      - name: Set up PHP ${{ matrix.php-version }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          tools: composer:v2
          coverage: xdebug

      - name: Pin TYPO3 version (${{ matrix.typo3-version }})
        run: composer require --no-update --no-interaction "typo3/cms-core:${{ matrix.typo3-version }}" "typo3/cms-fluid:${{ matrix.typo3-version }}" "typo3/cms-workspaces:${{ matrix.typo3-version }}"

      - name: Install
        run: composer update --no-interaction --no-progress --prefer-dist

      - name: Run PHPUnit
        run: vendor/bin/phpunit -c Build/phpunit/UnitTests.xml --testdox

  functional-tests:
    name: Functional tests (PHP ${{ matrix.php-version }} · TYPO3 ${{ matrix.typo3-version }} · SQLite)
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        php-version: ["8.4", "8.5"]
        typo3-version: ["^14.3.6"]
    steps:
      - uses: actions/checkout@v5

      - name: Set up PHP ${{ matrix.php-version }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: pdo_sqlite
          tools: composer:v2
          coverage: none

      - name: Cache composer dependencies
        uses: actions/cache@v6
        with:
          path: ~/.cache/composer
          key: composer-${{ matrix.php-version }}-${{ matrix.typo3-version }}-${{ hashFiles('composer.json') }}

      - name: Pin TYPO3 version (${{ matrix.typo3-version }})
        run: composer require --no-update --no-interaction "typo3/cms-core:${{ matrix.typo3-version }}" "typo3/cms-fluid:${{ matrix.typo3-version }}" "typo3/cms-workspaces:${{ matrix.typo3-version }}" "typo3/cms-form:${{ matrix.typo3-version }}"

      - name: Install
        run: composer update --no-interaction --no-progress --prefer-dist

      - name: Run functional tests
        run: Build/Scripts/runFunctionalTests.sh

  generated-assets:
    name: Generated assets are in sync with sources
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"

      - name: Install npm dependencies
        run: npm ci

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          tools: composer:v2
          coverage: none

      - name: Verify generated assets are current
        run: Build/Scripts/check-generated-assets.sh

      - name: Show the stale diff
        if: failure()
        run: git diff -- Resources/Public
