<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      xmlns:cb="http://typo3.org/ns/TYPO3/CMS/ContentBlocks/ViewHelpers"
      xmlns:d="http://typo3.org/ns/Webconsulting/Desiderio/Components/ComponentCollection"
      data-namespace-typo3-fluid="true">

<f:asset.css identifier="d-newsletter-signup" href="{cb:assetPath()}/frontend.css"/>

<d:layout.section frame="{data.frame_class}" spaceBefore="{data.space_before_class}" spaceAfter="{data.space_after_class}" class="newsletter-signup">
    <d:layout.container>
        <f:if condition="{data.eyebrow} || {data.header} || {data.subheadline}">
            <d:molecule.sectionIntro prefix="newsletter-signup" class="newsletter-signup__intro">
                <f:fragment name="eyebrow"><f:if condition="{data.eyebrow}">{data -> f:render.text(field: 'eyebrow')}</f:if></f:fragment>
                <f:fragment name="heading"><f:if condition="{data.header}">{data -> f:render.text(field: 'header')}</f:if></f:fragment>
                <f:fragment name="lead"><f:if condition="{data.subheadline}">{data -> f:render.text(field: 'subheadline')}</f:if></f:fragment>
            </d:molecule.sectionIntro>
        </f:if>

        <div class="newsletter-signup__body">
            <d:molecule.card class="newsletter-signup__form-card">

                <d:molecule.formRenderer persistenceIdentifier="EXT:desiderio/Resources/Private/Forms/DesiderioNewsletter.form.yaml" class="newsletter-signup__form"/>
                <f:if condition="{data.privacy_text}">
                    <p class="newsletter-signup__privacy">{data -> f:render.text(field: 'privacy_text')}</p>
                </f:if>
            </d:molecule.card>

            <f:if condition="{data.points}">
                <ul class="newsletter-signup__points" role="list">
                    <f:for each="{data.points}" as="point">
                        <li class="newsletter-signup__point">
                            <span class="newsletter-signup__check" aria-hidden="true"><d:atom.icon name="check" size="sm"/></span>
                            <span>{point -> f:render.text(field: 'text')}</span>
                        </li>
                    </f:for>
                </ul>
            </f:if>
        </div>
    </d:layout.container>
</d:layout.section>

</html>
