<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      xmlns:cb="http://typo3.org/ns/TYPO3/CMS/ContentBlocks/ViewHelpers"
      xmlns:d="http://typo3.org/ns/Webconsulting/Desiderio/Components/ComponentCollection"
      data-namespace-typo3-fluid="true">

<f:asset.css identifier="d-cta-banner" href="{cb:assetPath()}/frontend.css"/>

<d:layout.section frame="{data.frame_class}" spaceBefore="{data.space_before_class}" spaceAfter="{data.space_after_class}" class="cta-banner cta-banner--{data.bg_style -> f:or(alternative: 'primary')}">
    <d:layout.container>
        <div class="cta-banner__content">
            <div class="cta-banner__text">
                <f:if condition="{data.header}"><d:atom.typography tag="h2" variant="h2" class="cta-banner__headline">{data -> f:render.text(field: 'header')}</d:atom.typography></f:if>
                <f:if condition="{data.description}"><div class="cta-banner__description d-richtext">{data -> f:render.text(field: 'description')}</div></f:if>
            </div>
            <f:if condition="{data.cta_text} && {data.cta_link.url}">
                <f:comment>The GitHub mark only says something true when the button goes to GitHub; "Book a demo" or a download keep a plain label.</f:comment>
                <div class="cta-banner__action">
                    <d:atom.button href="{f:uri.typolink(parameter: data.cta_link.url)}" target="{data.cta_link.target}" variant="{f:if(condition: '{data.bg_style} == \'muted\'', then: 'default', else: 'secondary')}" size="lg"><f:if condition="{f:contains(value: 'github.com', subject: data.cta_link.url)}"><span data-icon="inline-start" aria-hidden="true"><d:atom.icon name="brand-github" /></span></f:if>{data -> f:render.text(field: 'cta_text')}</d:atom.button>{data -> f:render.link(field: 'cta_link')}
                </div>
            </f:if>
        </div>
    </d:layout.container>
</d:layout.section>

</html>
