<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      xmlns:cb="http://typo3.org/ns/TYPO3/CMS/ContentBlocks/ViewHelpers"
      xmlns:d="http://typo3.org/ns/Webconsulting/Desiderio/Components/ComponentCollection"
      data-namespace-typo3-fluid="true">

<f:asset.css identifier="d-callout" href="{cb:assetPath()}/frontend.css"/>

<d:layout.section frame="{data.frame_class}" spaceBefore="{data.space_before_class}" spaceAfter="{data.space_after_class}" class="callout-section">
    <d:layout.container>
        <f:variable name="calloutIcon"><f:switch expression="{data.variant}"><f:case value="warning">alert-triangle</f:case><f:case value="success">check-circle</f:case><f:case value="danger">alert-circle</f:case><f:defaultCase>info</f:defaultCase></f:switch></f:variable>
        <div class="callout callout--{data.variant -> f:or(alternative: 'info')}" role="note">
            <span class="callout__icon" aria-hidden="true"><d:atom.icon name="{calloutIcon -> f:format.trim()}" size="sm"/></span>
            <f:if condition="{data.header}">
                <d:atom.typography tag="h2" variant="h4" class="callout__title">{data -> f:render.text(field: 'header')}</d:atom.typography>
            </f:if>
            <div class="callout__content d-richtext">
                {data -> f:render.text(field: 'content')}
            </div>
        </div>
    </d:layout.container>
</d:layout.section>

</html>
