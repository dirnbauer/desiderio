name: desiderio/feature-carousel
typeName: desiderio_featurecarousel
title: 'Feature Carousel Slider'
description: 'Renders a horizontally scrollable carousel of feature cards with a custom scroll indicator; each slide holds an optional icon, linked title, and rich-text description (minimum three slides). Use it for: long lists of features, services, or modules that would overflow a grid — visitors swipe through one card at a time. Prefer ''3-Column Feature Grid'' when a few features should stay visible at once; use ''Content Carousel'' for rotating image slides.'
group: features
prefixFields: false
basics:
  - TYPO3/Appearance
  - TYPO3/Links
  - TYPO3/Categories
fields:
  -
    identifier: header
    useExistingField: true
    label: 'LLL:EXT:desiderio/Resources/Private/Language/labels.xlf:heading'
  -
    identifier: subheadline
    type: Textarea
    label: 'LLL:EXT:desiderio/Resources/Private/Language/labels.xlf:subheadline'
    rows: 2
  -
    identifier: items
    type: Collection
    foreign_table: desiderio_icon_card_link
    shareAcrossTables: true
    shareAcrossFields: true
    prefixField: true
    label: 'Feature Slides'
    minItems: 3