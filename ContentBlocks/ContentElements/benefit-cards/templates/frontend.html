<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      xmlns:cb="http://typo3.org/ns/TYPO3/CMS/ContentBlocks/ViewHelpers"
      xmlns:d="http://typo3.org/ns/Webconsulting/Desiderio/Components/ComponentCollection"
      data-namespace-typo3-fluid="true">

<f:asset.css identifier="d-benefit-cards" href="{cb:assetPath()}/frontend.css"/>

<d:layout.section frame="{data.frame_class}" spaceBefore="{data.space_before_class}" spaceAfter="{data.space_after_class}" class="benefit-cards">
    <d:layout.container>
        <f:if condition="{data.eyebrow} || {data.header} || {data.subheadline}">
            <d:molecule.sectionIntro prefix="benefit-cards" align="center" leadVariant="lead" class="benefit-cards__intro" leadClass="benefit-cards__subheadline">
                <f:fragment name="eyebrow"><f:if condition="{data.eyebrow}">{data -> f:render.text(field: 'eyebrow')}</f:if></f:fragment>
                <f:fragment name="heading"><f:if condition="{data.header}">{data -> f:render.text(field: 'header')}</f:if></f:fragment>
                <f:fragment name="lead"><f:if condition="{data.subheadline}">{data -> f:render.text(field: 'subheadline')}</f:if></f:fragment>
            </d:molecule.sectionIntro>
        </f:if>

        <ul class="benefit-cards__grid benefit-cards__grid--cols-{data.columns -> f:or(alternative: '3')}" role="list">
            <f:for each="{data.items}" as="item">
                <li class="benefit-cards__cell">
                    <d:molecule.card class="benefit-cards__item relative min-w-0 flex-1 has-[a:focus-visible]:ring-2 has-[a:focus-visible]:ring-ring">
                        <f:if condition="{item.icon}">
                            <span class="benefit-cards__icon" aria-hidden="true"><d:atom.icon name="{item.icon}" size="lg"/></span>
                        </f:if>
                        <div class="benefit-cards__body flex min-w-0 flex-col gap-1.5">
                            <d:atom.typography tag="h3" variant="large" class="benefit-cards__title">
                                <f:if condition="{item.link.url}">
                                    <f:then><d:atom.link href="{f:uri.typolink(parameter: item.link.url)}" target="{item.link.target}" variant="muted" class="benefit-cards__title-link focus-visible:outline-none after:absolute after:inset-0 after:content-['']">{item -> f:render.text(field: 'title')}</d:atom.link></f:then>
                                    <f:else>{item -> f:render.text(field: 'title')}</f:else>
                                </f:if>
                            </d:atom.typography>
                            <f:if condition="{item.description}">
                                <div class="benefit-cards__description d-richtext">{item -> f:render.text(field: 'description')}</div>
                            </f:if>
                        </div>
                    </d:molecule.card>
                </li>
            </f:for>
        </ul>
    </d:layout.container>
</d:layout.section>

</html>
