<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      xmlns:cb="http://typo3.org/ns/TYPO3/CMS/ContentBlocks/ViewHelpers"
      xmlns:d="http://typo3.org/ns/Webconsulting/Desiderio/Components/ComponentCollection"
      data-namespace-typo3-fluid="true">

<f:asset.css identifier="d-stats" href="{cb:assetPath()}/frontend.css"/>

<d:layout.section frame="{data.frame_class}" spaceBefore="{data.space_before_class}" spaceAfter="{data.space_after_class}" class="stats">
    <d:layout.container>
        <f:if condition="{data.eyebrow} || {data.header} || {data.subheadline}">
            <d:molecule.sectionIntro prefix="stats" class="stats__intro" headingClass="stats__headline" leadVariant="lead" leadClass="stats__description">
                <f:fragment name="eyebrow"><f:if condition="{data.eyebrow}">{data -> f:render.text(field: 'eyebrow')}</f:if></f:fragment>
                <f:fragment name="heading"><f:if condition="{data.header}">{data -> f:render.text(field: 'header')}</f:if></f:fragment>
                <f:fragment name="lead"><f:if condition="{data.subheadline}">{data -> f:render.text(field: 'subheadline')}</f:if></f:fragment>
            </d:molecule.sectionIntro>
        </f:if>

        <dl class="stats__grid stats__grid--cols-{data.columns -> f:or(alternative: '4')}"
            aria-label="{f:translate(key: 'LLL:EXT:desiderio/Resources/Private/Language/labels.xlf:stats.aria')}">
            <f:for each="{data.stats}" as="stat">
                <div class="stats__item" data-astro-reveal="slide-up">
                    <dt class="stats__label">{stat -> f:render.text(field: 'label')}</dt>
                    <dd class="stats__value" data-astro-counter>{stat -> f:render.text(field: 'value')}</dd>
                    <f:if condition="{stat.description}">
                        <dd class="stats__item-description d-richtext">{stat -> f:render.text(field: 'description')}</dd>
                    </f:if>
                </div>
            </f:for>
        </dl>
    </d:layout.container>
</d:layout.section>
</html>
