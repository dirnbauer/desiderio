<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      xmlns:cb="http://typo3.org/ns/TYPO3/CMS/ContentBlocks/ViewHelpers"
      xmlns:d="http://typo3.org/ns/Webconsulting/Desiderio/Components/ComponentCollection"
      data-namespace-typo3-fluid="true">

<f:asset.css identifier="d-contact-info" href="{cb:assetPath()}/frontend.css"/>

<d:layout.section frame="{data.frame_class}" spaceBefore="{data.space_before_class}" spaceAfter="{data.space_after_class}" class="contact-info">
    <d:layout.container>
        <f:if condition="{data.header} || {data.subheadline}">
            <d:molecule.sectionIntro prefix="contact-info" class="contact-info__intro">
                <f:fragment name="heading"><f:if condition="{data.header}">{data -> f:render.text(field: 'header')}</f:if></f:fragment>
                <f:fragment name="lead"><f:if condition="{data.subheadline}">{data -> f:render.text(field: 'subheadline')}</f:if></f:fragment>
            </d:molecule.sectionIntro>
        </f:if>

        <div class="contact-info__grid">
            <f:for each="{data.items}" as="item">
                <d:molecule.card class="contact-info__item">
                    <f:if condition="{item.icon}"><span class="contact-info__icon" aria-hidden="true"><d:atom.icon name="{item.icon}" size="lg"/></span></f:if>
                    <h3 class="contact-info__label">{item -> f:render.text(field: 'label')}</h3>
                    <f:if condition="{item.link.url}">
                        <f:then>
                            <d:atom.link href="{f:uri.typolink(parameter: item.link.url)}" target="{item.link.target}" variant="muted" class="contact-info__value contact-info__value--link">{item -> f:render.text(field: 'value')}</d:atom.link>
                        </f:then>
                        <f:else>
                            <p class="contact-info__value">{item -> f:render.text(field: 'value')}</p>
                        </f:else>
                    </f:if>
                </d:molecule.card>
            </f:for>
        </div>
    </d:layout.container>
</d:layout.section>

</html>
