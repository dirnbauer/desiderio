<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      xmlns:cb="http://typo3.org/ns/TYPO3/CMS/ContentBlocks/ViewHelpers"
      xmlns:d="http://typo3.org/ns/Webconsulting/Desiderio/Components/ComponentCollection"
      data-namespace-typo3-fluid="true">

<f:asset.css identifier="d-feature-icons" href="{cb:assetPath()}/frontend.css"/>

<d:layout.section frame="{data.frame_class}" spaceBefore="{data.space_before_class}" spaceAfter="{data.space_after_class}" class="feature-icons">
    <d:layout.container>
        <f:if condition="{data.header}">
            <header class="feature-icons__intro">
                <d:atom.typography tag="h2" variant="h2">{data -> f:render.text(field: 'header')}</d:atom.typography>
            </header>
        </f:if>

        <div class="feature-icons__grid feature-icons__grid--cols-{data.columns -> f:or(alternative: '4')}">
            <f:for each="{data.items}" as="item">
                <d:molecule.featureItem prefix="feature-icons" class="feature-icons__item" icon="{item.icon}" iconSize="xl">
                    <f:fragment name="title">{item -> f:render.text(field: 'title')}</f:fragment>
                    <f:fragment name="text"><f:if condition="{item.description_text}">{item -> f:render.text(field: 'description_text')}</f:if></f:fragment>
                </d:molecule.featureItem>
            </f:for>
        </div>
    </d:layout.container>
</d:layout.section>

</html>
