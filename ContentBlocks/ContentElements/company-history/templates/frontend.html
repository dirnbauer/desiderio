<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      xmlns:cb="http://typo3.org/ns/TYPO3/CMS/ContentBlocks/ViewHelpers"
      xmlns:d="http://typo3.org/ns/Webconsulting/Desiderio/Components/ComponentCollection"
      data-namespace-typo3-fluid="true">

<f:asset.css identifier="d-company-history" href="{cb:assetPath()}/frontend.css"/>

<d:layout.section frame="{data.frame_class}" spaceBefore="{data.space_before_class}" spaceAfter="{data.space_after_class}" class="company-history">
    <d:layout.container>
        <f:if condition="{data.header} || {data.subheadline}">
            <d:molecule.sectionIntro prefix="company-history" class="company-history__intro">
                <f:fragment name="heading"><f:if condition="{data.header}">{data -> f:render.text(field: 'header')}</f:if></f:fragment>
                <f:fragment name="lead"><f:if condition="{data.subheadline}">{data -> f:render.text(field: 'subheadline')}</f:if></f:fragment>
            </d:molecule.sectionIntro>
        </f:if>

        <ol class="company-history__timeline">
            <f:for each="{data.events}" as="event">
                <li class="company-history__event">
                    <span class="company-history__year">{event -> f:render.text(field: 'year')}</span>
                    <div class="company-history__body">
                        <d:atom.typography tag="h3" variant="large" class="company-history__title">{event -> f:render.text(field: 'title')}</d:atom.typography>
                        <f:if condition="{event.description}"><div class="company-history__description d-richtext">{event -> f:render.text(field: 'description')}</div></f:if>
                    </div>
                </li>
            </f:for>
        </ol>
    </d:layout.container>
</d:layout.section>

</html>
