<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      xmlns:cb="http://typo3.org/ns/TYPO3/CMS/ContentBlocks/ViewHelpers"
      xmlns:d="http://typo3.org/ns/Webconsulting/Desiderio/Components/ComponentCollection"
      data-namespace-typo3-fluid="true">

<f:asset.css identifier="d-feature-video" href="{cb:assetPath()}/frontend.css"/>

<f:variable name="videoTitle">{data.header -> f:or(alternative: '{f:translate(key: \'LLL:EXT:desiderio/Resources/Private/Language/labels.xlf:video_title\')}')}</f:variable>

<d:layout.section frame="{data.frame_class}" spaceBefore="{data.space_before_class}" spaceAfter="{data.space_after_class}" class="feature-video">
    <d:layout.container>
        <f:if condition="{data.eyebrow} || {data.header} || {data.description}">
            <d:molecule.sectionIntro prefix="feature-video" class="feature-video__intro" leadClass="d-richtext" leadTag="div">
                <f:fragment name="eyebrow"><f:if condition="{data.eyebrow}">{data -> f:render.text(field: 'eyebrow')}</f:if></f:fragment>
                <f:fragment name="heading"><f:if condition="{data.header}">{data -> f:render.text(field: 'header')}</f:if></f:fragment>
                <f:fragment name="lead"><f:if condition="{data.description}">{data -> f:render.text(field: 'description')}</f:if></f:fragment>
            </d:molecule.sectionIntro>
        </f:if>

        <div class="feature-video__player">
            <f:if condition="{data.video_url}">
                <f:then>
                    <div class="feature-video__embed">
                        <iframe src="{data.video_url}" title="{videoTitle -> f:format.trim()}" frameborder="0" allowfullscreen loading="lazy"
                                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"></iframe>
                    </div>
                </f:then>
                <f:else>
                    <f:if condition="{data.video_file.0}">
                        <video class="feature-video__native" controls playsinline preload="metadata" aria-label="{videoTitle -> f:format.trim()}"
                               {f:if(condition: data.poster.0, then: 'poster="{f:uri.image(image: data.poster.0, maxWidth: 1280)}"')}>
                            <source src="{data.video_file.0.publicUrl}" type="{data.video_file.0.mimeType}"/>
                            <f:if condition="{data.captions_file.0}">
                                <track kind="captions" src="{data.captions_file.0.publicUrl}" srclang="en" label="English"/>
                            </f:if>
                            <a href="{data.video_file.0.publicUrl}"><f:translate key="LLL:EXT:desiderio/Resources/Private/Language/labels.xlf:video_download"/></a>
                        </video>
                    </f:if>
                </f:else>
            </f:if>
        </div>
    </d:layout.container>
</d:layout.section>

</html>
