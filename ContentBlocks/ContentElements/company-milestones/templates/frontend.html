<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      xmlns:cb="http://typo3.org/ns/TYPO3/CMS/ContentBlocks/ViewHelpers"
      xmlns:d="http://typo3.org/ns/Webconsulting/Desiderio/Components/ComponentCollection"
      data-namespace-typo3-fluid="true">

<f:asset.css identifier="d-company-milestones" href="{cb:assetPath()}/frontend.css"/>

<d:layout.section frame="{data.frame_class}" spaceBefore="{data.space_before_class}" spaceAfter="{data.space_after_class}" class="company-milestones">
    <d:layout.container>
        <f:if condition="{data.header} || {data.subheadline}">
            <d:molecule.sectionIntro prefix="company-milestones" class="company-milestones__intro" leadClass="company-milestones__subheadline">
                <f:fragment name="heading"><f:if condition="{data.header}">{data -> f:render.text(field: 'header')}</f:if></f:fragment>
                <f:fragment name="lead"><f:if condition="{data.subheadline}">{data -> f:render.text(field: 'subheadline')}</f:if></f:fragment>
            </d:molecule.sectionIntro>
        </f:if>

        <ol class="company-milestones__grid">
            <f:for each="{data.milestones}" as="ms" iteration="i">
                <li class="company-milestones__item">
                    <f:if condition="{ms.year}">
                        <span class="company-milestones__year">{ms -> f:render.text(field: 'year')}</span>
                        <f:else>
                            <span class="company-milestones__year" aria-hidden="true">{i.cycle}</span>
                        </f:else>
                    </f:if>
                    <h3 class="company-milestones__title">{ms -> f:render.text(field: 'title')}</h3>
                    <f:if condition="{ms.description}"><div class="company-milestones__description d-richtext">{ms -> f:render.text(field: 'description')}</div></f:if>
                </li>
            </f:for>
        </ol>
    </d:layout.container>
</d:layout.section>

</html>
