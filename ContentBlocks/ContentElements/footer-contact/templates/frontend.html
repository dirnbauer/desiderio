<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      xmlns:cb="http://typo3.org/ns/TYPO3/CMS/ContentBlocks/ViewHelpers"
      xmlns:d="http://typo3.org/ns/Webconsulting/Desiderio/Components/ComponentCollection"
      data-namespace-typo3-fluid="true">

<f:asset.css identifier="d-footer-contact" href="{cb:assetPath()}/frontend.css"/>

<footer class="footer-contact" aria-label="{data.header -> f:or(alternative: '{f:translate(key: \'LLL:EXT:desiderio/Resources/Private/Language/labels.xlf:footer.aria\', default: \'Footer\')}')}">
    <d:layout.container>
        <div class="footer-contact__inner">
            <f:if condition="{data.header}">
                <d:atom.typography tag="h2" variant="h2" class="footer-contact__title">{data -> f:render.text(field: 'header')}</d:atom.typography>
            </f:if>
            <div class="footer-contact__grid">
                <f:if condition="{data.address}">
                    <div class="footer-contact__item">
                        <d:atom.icon name="map-pin" size="default" />
                        <span class="footer-contact__text">{data -> f:render.text(field: 'address')}</span>
                    </div>
                </f:if>
                <f:if condition="{data.email}">
                    <div class="footer-contact__item">
                        <d:atom.icon name="mail" size="default" />
                        <a href="mailto:{data.email}" class="footer-contact__link">{data -> f:render.text(field: 'email')}</a>
                    </div>
                </f:if>
                <f:if condition="{data.phone}">
                    <div class="footer-contact__item">
                        <d:atom.icon name="phone" size="default" />
                        <a href="tel:{data.phone -> f:replace(search: ' ', replace: '')}" class="footer-contact__link">{data -> f:render.text(field: 'phone')}</a>
                    </div>
                </f:if>
                <f:if condition="{data.hours}">
                    <div class="footer-contact__item">
                        <d:atom.icon name="clock" size="default" />
                        <span class="footer-contact__text">{data -> f:render.text(field: 'hours')}</span>
                    </div>
                </f:if>
            </div>
        </div>
        <f:if condition="{data.copyright}">
            <div class="footer-contact__bottom">
                <p class="footer-contact__copyright">{data -> f:render.text(field: 'copyright')}</p>
            </div>
        </f:if>
    </d:layout.container>
</footer>

</html>
