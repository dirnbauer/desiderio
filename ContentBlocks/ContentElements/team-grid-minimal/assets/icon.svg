<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" fill="none" class="icon-root">
  <title>Minimal Team Grid icon</title>
  <style>.icon-root{color-scheme:light dark}.icon-root .s{fill:currentColor}.icon-root .sd{fill:none;stroke:currentColor;stroke-width:1.05;stroke-linecap:round;stroke-linejoin:round}.icon-root .a{fill:var(--icon-color-accent,currentColor)}.icon-root .o,.icon-root .ao{fill:none;stroke:currentColor;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}.icon-root .ao{stroke:var(--icon-color-accent,currentColor)}</style>
  <g transform="translate(-.8 -.8) scale(1.1)"><rect class="sd" x="2.4" y="2.4" width="11.2" height="11.2" rx="2"/><circle class="s" cx="5.5" cy="5.5" r="1.5"/><circle class="a icon-signature" cx="10.5" cy="5.5" r="1.5"/><circle class="s" cx="5.5" cy="10.5" r="1.5"/><circle class="s" cx="10.5" cy="10.5" r="1.5"/></g>
</svg>
