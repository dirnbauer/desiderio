name: CI

# One workflow for the whole PHP side of the extension:
#   lint        php -l over every PHP file the extension ships
#   cgl         typo3/coding-standards via php-cs-fixer, plus composer metadata
#   phpstan     level 8, no baseline
#   unit        PHPUnit unit suite
#   functional  PHPUnit functional suite against MariaDB 10.11
#   assets      generated files under Resources/Public are in sync (optional)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  TYPO3_VERSION: "^14.3.6"

jobs:
  lint:
    name: PHP syntax lint
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        php-version: ["8.4", "8.5"]
    steps:
      - uses: actions/checkout@v7

      - name: Set up PHP ${{ matrix.php-version }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          tools: composer:v2
          coverage: none

      - name: Lint
        run: |
          find Classes Configuration Tests ext_emconf.php ext_localconf.php \
            -name '*.php' -print0 | xargs -0 -n1 -P4 php -l > /dev/null

  cgl:
    name: Coding standards + composer metadata
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Set up PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          tools: composer:v2
          coverage: none

      - name: Cache composer dependencies
        uses: actions/cache@v6
        with:
          path: ~/.cache/composer
          key: composer-cgl-${{ hashFiles('composer.json') }}

      - name: Install
        run: composer update --no-interaction --no-progress --prefer-dist

      - name: Validate composer.json
        run: composer validate --strict --no-check-publish

      - name: Audit composer dependencies
        run: composer audit --no-dev --abandoned=fail

      - name: Check coding standards
        run: vendor/bin/php-cs-fixer fix --dry-run --diff

  phpstan:
    name: PHPStan level 8 (PHP ${{ matrix.php-version }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        php-version: ["8.4", "8.5"]
    steps:
      - uses: actions/checkout@v7

      - name: Set up PHP ${{ matrix.php-version }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          tools: composer:v2
          coverage: none

      - name: Cache composer dependencies
        uses: actions/cache@v6
        with:
          path: ~/.cache/composer
          key: composer-${{ matrix.php-version }}-${{ hashFiles('composer.json') }}

      - name: Pin TYPO3 version (${{ env.TYPO3_VERSION }})
        run: composer require --no-update --no-interaction "typo3/cms-core:${TYPO3_VERSION}" "typo3/cms-fluid:${TYPO3_VERSION}" "typo3/cms-workspaces:${TYPO3_VERSION}"

      - name: Install
        run: composer update --no-interaction --no-progress --prefer-dist

      - name: Run PHPStan
        run: vendor/bin/phpstan analyse --configuration=phpstan.neon --no-progress --memory-limit=2G

  unit-tests:
    name: PHPUnit unit (PHP ${{ matrix.php-version }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        php-version: ["8.4", "8.5"]
    steps:
      - uses: actions/checkout@v7

      - name: Set up PHP ${{ matrix.php-version }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          tools: composer:v2
          coverage: none

      - name: Cache composer dependencies
        uses: actions/cache@v6
        with:
          path: ~/.cache/composer
          key: composer-${{ matrix.php-version }}-${{ hashFiles('composer.json') }}

      - name: Pin TYPO3 version (${{ env.TYPO3_VERSION }})
        run: composer require --no-update --no-interaction "typo3/cms-core:${TYPO3_VERSION}" "typo3/cms-fluid:${TYPO3_VERSION}" "typo3/cms-workspaces:${TYPO3_VERSION}"

      - name: Install
        run: composer update --no-interaction --no-progress --prefer-dist

      - name: Run PHPUnit
        run: vendor/bin/phpunit -c Build/phpunit/UnitTests.xml --testdox

  functional-tests:
    name: PHPUnit functional (PHP ${{ matrix.php-version }} · MariaDB 10.11)
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        php-version: ["8.4", "8.5"]
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: funcp
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      TYPO3_CONTEXT: Testing
      typo3DatabaseDriver: mysqli
      typo3DatabaseHost: 127.0.0.1
      typo3DatabasePort: "3306"
      typo3DatabaseUsername: root
      typo3DatabasePassword: funcp
      typo3DatabaseName: desiderio_functional
    steps:
      - uses: actions/checkout@v7

      - name: Set up PHP ${{ matrix.php-version }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: mysqli
          tools: composer:v2
          coverage: none

      - name: Cache composer dependencies
        uses: actions/cache@v6
        with:
          path: ~/.cache/composer
          key: composer-${{ matrix.php-version }}-${{ hashFiles('composer.json') }}

      - name: Pin TYPO3 version (${{ env.TYPO3_VERSION }})
        run: composer require --no-update --no-interaction "typo3/cms-core:${TYPO3_VERSION}" "typo3/cms-fluid:${TYPO3_VERSION}" "typo3/cms-workspaces:${TYPO3_VERSION}" "typo3/cms-form:${TYPO3_VERSION}"

      - name: Install
        run: composer update --no-interaction --no-progress --prefer-dist

      - name: Run functional tests
        env:
          TYPO3_PATH_ROOT: ${{ github.workspace }}/Build/Functional/document-root
        run: php -d memory_limit=1G vendor/bin/phpunit -c Build/phpunit/FunctionalTests.xml --testdox

  theme-contrast:
    name: Theme contrast (WCAG 2.2 AA, every preset, frame and panel)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          coverage: none

      # Token pairs of all fifteen presets in light and dark mode, inside the
      # painted frames and the panels, plus the glass header and the horizon
      # as 22-modern-base.css composes them. Fails on any required pair below
      # WCAG 2.2 AA and on a colour token redeclared where it is not measured.
      - name: Audit theme contrast
        run: php Build/Scripts/audit-theme-contrast.php

  generated-assets:
    name: Generated assets are in sync with sources
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Use pinned npm
        run: npm install --global npm@12.2.1

      - uses: actions/setup-python@v7
        with:
          python-version-file: ".python-version"

      - name: Install npm dependencies
        run: npm ci

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          tools: composer:v2
          coverage: none

      - name: Verify generated assets are current
        run: |
          npm run test:iconfonts
          Build/Scripts/check-generated-assets.sh
          git diff --exit-code -- Build/hugeicons/codepoints.json

      - name: Install Chromium for icon font acceptance
        run: |
          # The Azure archive served font dependencies at ~40 KB/s; use the
          # primary Ubuntu archive with the same signed packages and tests.
          for ubuntu_source_file in /etc/apt/sources.list.d/ubuntu.sources /etc/apt/apt-mirrors.txt; do
            if [ -f "$ubuntu_source_file" ]; then
              sudo sed -i 's/azure.archive.ubuntu.com/archive.ubuntu.com/g' "$ubuntu_source_file"
            fi
          done
          npx playwright install --with-deps chromium

      - name: Verify rendered HugeIcons fonts and published mappings
        run: npm run test:iconfonts:browser

      - name: Upload icon font evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: hugeicons-font-acceptance
          path: var/hugeicons-browser/
          retention-days: 14

      - name: Show the stale diff
        if: failure()
        run: git diff -- Resources/Public
