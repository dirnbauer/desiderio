<html
    xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
    xmlns:d="http://typo3.org/ns/Webconsulting/Desiderio/Components/ComponentCollection"
    data-namespace-typo3-fluid="true"
>

<f:argument name="page" type="object" />
<f:argument name="newsDetailUid" type="string" optional="{true}" default="" />

<f:comment>
    The single page-level h1. Pages whose first authored block already exposes
    the title can select the screen-reader-only variant. News detail views own
    their article h1 and therefore suppress this organism entirely.
</f:comment>
<f:if condition="!{newsDetailUid}">
    <f:if condition="{page.pageRecord.tx_desiderio_h1_sronly}">
        <f:then>
            <h1 class="sr-only">{page.pageRecord.title}</h1>
        </f:then>
        <f:else>
            <d:layout.container class="desiderio-page-title-container">
                <header class="py-8 md:py-10" data-slot="page-header">
                    <d:atom.typography tag="h1" variant="h2" class="max-w-4xl text-balance md:text-4xl">{page.pageRecord.title}</d:atom.typography>
                </header>
                <d:atom.separator />
            </d:layout.container>
        </f:else>
    </f:if>
</f:if>

</html>
