<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      xmlns:cb="http://typo3.org/ns/TYPO3/CMS/ContentBlocks/ViewHelpers"
      xmlns:d="http://typo3.org/ns/Webconsulting/Desiderio/Components/ComponentCollection"
      data-namespace-typo3-fluid="true">

<f:asset.css identifier="d-feature-list" href="{cb:assetPath()}/frontend.css"/>

<d:layout.section frame="{data.frame_class}" spaceBefore="{data.space_before_class}" spaceAfter="{data.space_after_class}" class="feature-list feature-list--{data.shadcn_layout -> f:or(alternative: 'two-columns')}">
    <d:layout.container>
        <f:if condition="{data.eyebrow} || {data.header} || {data.subheadline}">
            <d:molecule.sectionIntro prefix="feature-list" class="feature-list__intro">
                <f:fragment name="eyebrow"><f:if condition="{data.eyebrow}">{data -> f:render.text(field: 'eyebrow')}</f:if></f:fragment>
                <f:fragment name="heading"><f:if condition="{data.header}">{data -> f:render.text(field: 'header')}</f:if></f:fragment>
                <f:fragment name="lead"><f:if condition="{data.subheadline}">{data -> f:render.text(field: 'subheadline')}</f:if></f:fragment>
            </d:molecule.sectionIntro>
        </f:if>

        <div class="feature-list__items">
            <f:for each="{data.items}" as="item">
                <d:molecule.card class="feature-list__item">
                    <div class="feature-list__icon" aria-hidden="true"><d:atom.icon name="{item.icon -> f:or(alternative: 'check')}" size="sm"/></div>
                    <div class="feature-list__copy">
                        <h3 class="feature-list__title">{item -> f:render.text(field: 'title')}</h3>
                        <f:if condition="{item.description}">
                            <div class="feature-list__description d-richtext">{item -> f:render.text(field: 'description')}</div>
                        </f:if>
                    </div>
                </d:molecule.card>
            </f:for>
        </div>
    </d:layout.container>
</d:layout.section>

</html>
