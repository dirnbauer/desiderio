name: desiderio/metric-dashboard
typeName: desiderio_metricdashboard
title: 'Metric Dashboard'
description: 'Renders a dashboard panel of metric tiles — each with label, value, optional change text, and an up, down, or neutral trend icon — plus an optional line chart fed from a JSON array with series label and unit. Use it for: KPI overviews, quarterly or annual results, growth and revenue figures, investor updates. Prefer ''KPI Cards'' for metric tiles without a chart, ''Line Chart'' for a chart alone.'
group: data
prefixFields: false
basics:
  - TYPO3/Appearance
  - TYPO3/Links
  - TYPO3/Categories
fields:
  -
    identifier: header
    useExistingField: true
    label: 'LLL:EXT:desiderio/Resources/Private/Language/labels.xlf:heading'
  -
    identifier: description
    type: Textarea
    enableRichtext: true
    richtextConfiguration: desiderio
    label: 'LLL:EXT:desiderio/Resources/Private/Language/labels.xlf:description'
    rows: 2
  -
    identifier: items
    type: Collection
    foreign_table: desiderio_metric_item
    shareAcrossTables: true
    shareAcrossFields: true
    prefixField: true
    label: Metrics
    minItems: 1
  -
    identifier: chart_data
    type: Textarea
    label: 'Chart Data (JSON)'
    description: 'Optional JSON array for the overview chart. Use objects with label and value for axis labels.'
    rows: 4
  -
    identifier: chart_series_label
    type: Text
    label: 'Chart series label'
    default: 'Monthly recurring revenue'
  -
    identifier: chart_unit
    type: Text
    label: 'Chart unit'
    default: 'k USD'
