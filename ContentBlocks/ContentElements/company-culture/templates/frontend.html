<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      xmlns:cb="http://typo3.org/ns/TYPO3/CMS/ContentBlocks/ViewHelpers"
      xmlns:d="http://typo3.org/ns/Webconsulting/Desiderio/Components/ComponentCollection"
      data-namespace-typo3-fluid="true">

<f:asset.css identifier="d-company-culture" href="{cb:assetPath()}/frontend.css"/>

<d:layout.section frame="{data.frame_class}" spaceBefore="{data.space_before_class}" spaceAfter="{data.space_after_class}" class="company-culture">
    <d:layout.container>
        <f:if condition="{data.eyebrow} || {data.header} || {data.subheadline}">
            <d:molecule.sectionIntro prefix="company-culture" class="company-culture__intro">
                <f:fragment name="eyebrow"><f:if condition="{data.eyebrow}">{data -> f:render.text(field: 'eyebrow')}</f:if></f:fragment>
                <f:fragment name="heading"><f:if condition="{data.header}">{data -> f:render.text(field: 'header')}</f:if></f:fragment>
                <f:fragment name="lead"><f:if condition="{data.subheadline}">{data -> f:render.text(field: 'subheadline')}</f:if></f:fragment>
            </d:molecule.sectionIntro>
        </f:if>

        <div class="company-culture__grid">
            <f:for each="{data.items}" as="item">
                <article class="company-culture__item">
                    <f:if condition="{item.image}">
                        <div class="company-culture__image-wrapper">
                            <f:for each="{item.image}" as="fileReference">
                                <f:image image="{fileReference}" maxWidth="640" alt="{item.title}" class="company-culture__image" loading="lazy" decoding="async"/>
                            </f:for>
                        </div>
                    </f:if>
                    <f:if condition="{item.title}"><h3 class="company-culture__title">{item -> f:render.text(field: 'title')}</h3></f:if>
                    <f:if condition="{item.description}"><div class="company-culture__description d-richtext">{item -> f:render.text(field: 'description')}</div></f:if>
                </article>
            </f:for>
        </div>
    </d:layout.container>
</d:layout.section>

</html>
