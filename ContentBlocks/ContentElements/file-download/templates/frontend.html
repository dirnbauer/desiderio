<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      xmlns:cb="http://typo3.org/ns/TYPO3/CMS/ContentBlocks/ViewHelpers"
      xmlns:d="http://typo3.org/ns/Webconsulting/Desiderio/Components/ComponentCollection"
      data-namespace-typo3-fluid="true">

<f:asset.css identifier="d-file-download" href="{cb:assetPath()}/frontend.css"/>

<d:layout.section frame="{data.frame_class}" spaceBefore="{data.space_before_class}" spaceAfter="{data.space_after_class}" class="file-download">
    <d:layout.container>
        <f:if condition="{data.header}">
            <d:atom.typography tag="h2" variant="h2" class="file-download__headline">{data -> f:render.text(field: 'header')}</d:atom.typography>
        </f:if>

        <div class="file-download__list">
            <f:for each="{data.items}" as="item">
                <d:molecule.card class="file-download__item">
                    <div class="file-download__icon" aria-hidden="true">
                        <d:atom.icon name="download" size="lg" />
                    </div>
                    <div class="file-download__info">
                        <d:atom.typography tag="h3" variant="h4" class="file-download__title">{item -> f:render.text(field: 'title')}</d:atom.typography>
                        <f:if condition="{item.description_text}">
                            <p class="file-download__description">{item -> f:render.text(field: 'description_text')}</p>
                        </f:if>
                        <div class="file-download__meta">
                            <f:if condition="{item.file_size}"><span class="file-download__size">{item -> f:render.text(field: 'file_size')}</span></f:if>
                        </div>
                    </div>
                    <f:if condition="{item.file.0}">
                        <a href="{item.file.0.publicUrl}" class="file-download__link" download aria-label="{f:translate(key: 'LLL:EXT:desiderio/Resources/Private/Language/labels.xlf:download_file', default: 'Download')} {item.title}">
                            <f:translate key="LLL:EXT:desiderio/Resources/Private/Language/labels.xlf:download_file" default="Download"/>
                        </a>
                    </f:if>
                </d:molecule.card>
            </f:for>
        </div>
    </d:layout.container>
</d:layout.section>

</html>
