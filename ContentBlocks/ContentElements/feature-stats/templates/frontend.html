<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      xmlns:cb="http://typo3.org/ns/TYPO3/CMS/ContentBlocks/ViewHelpers"
      xmlns:d="http://typo3.org/ns/Webconsulting/Desiderio/Components/ComponentCollection"
      data-namespace-typo3-fluid="true">

<f:asset.css identifier="d-feature-stats" href="{cb:assetPath()}/frontend.css"/>

<d:layout.section frame="{data.frame_class}" spaceBefore="{data.space_before_class}" spaceAfter="{data.space_after_class}" class="feature-stats">
    <d:layout.container>
        <div class="feature-stats__layout {f:if(condition: '{data.header} || {data.description}', else: 'feature-stats__layout--full')}">
            <f:if condition="{data.header} || {data.description}">
                <d:molecule.sectionIntro prefix="feature-stats" class="feature-stats__copy" leadClass="feature-stats__description">
                    <f:fragment name="heading"><f:if condition="{data.header}">{data -> f:render.text(field: 'header')}</f:if></f:fragment>
                    <f:fragment name="lead"><f:if condition="{data.description}">{data -> f:render.text(field: 'description')}</f:if></f:fragment>
                </d:molecule.sectionIntro>
            </f:if>
            <dl class="feature-stats__grid">
                <f:for each="{data.items}" as="item">
                    <div class="feature-stats__item" data-astro-reveal="slide-up">
                        <dt class="feature-stats__label">{item -> f:render.text(field: 'label')}</dt>
                        <dd class="feature-stats__value" data-astro-counter>{item -> f:render.text(field: 'value')}</dd>
                        <f:if condition="{item.description_text}">
                            <dd class="feature-stats__detail">{item -> f:render.text(field: 'description_text')}</dd>
                        </f:if>
                    </div>
                </f:for>
            </dl>
        </div>
    </d:layout.container>
</d:layout.section>

</html>
