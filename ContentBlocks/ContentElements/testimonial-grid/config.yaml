name: desiderio/testimonial-grid
typeName: desiderio_testimonialgrid
title: 'Grid Testimonial'
description: 'Renders an even two- or three-column grid of uniform quote cards — each with quote, author avatar, name, and title — under an optional eyebrow and heading. Use it for: collections of roughly three to nine customer quotes, reviews sections on homepages or landing pages, ''what our customers say'' blocks from a source document. Prefer ''Testimonial Wall'' for many quotes in a masonry layout; use ''Carousel Testimonial'' when space is tight.'
group: social-proof
prefixFields: false
basics:
  - TYPO3/Appearance
  - TYPO3/Links
  - TYPO3/Categories
fields:
  -
    identifier: header
    useExistingField: true
    label: 'LLL:EXT:desiderio/Resources/Private/Language/labels.xlf:heading'
  -
    identifier: eyebrow
    type: Textarea
    rows: 1
    label: 'LLL:EXT:desiderio/Resources/Private/Language/labels.xlf:eyebrow'
  -
    identifier: columns
    type: Select
    renderType: selectSingle
    label: 'LLL:EXT:desiderio/Resources/Private/Language/labels.xlf:columns'
    items:
      -
        label: 'LLL:EXT:desiderio/Resources/Private/Language/labels.xlf:item.2_columns'
        value: '2'
      -
        label: 'LLL:EXT:desiderio/Resources/Private/Language/labels.xlf:item.3_columns'
        value: '3'
    default: '3'
  -
    identifier: testimonials
    type: Collection
    foreign_table: desiderio_quote_item
    shareAcrossTables: true
    shareAcrossFields: true
    prefixField: true
    label: Testimonials
    minItems: 1