<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      xmlns:cb="http://typo3.org/ns/TYPO3/CMS/ContentBlocks/ViewHelpers"
      xmlns:d="http://typo3.org/ns/Webconsulting/Desiderio/Components/ComponentCollection"
      data-namespace-typo3-fluid="true">

<f:asset.css identifier="d-partner-grid" href="{cb:assetPath()}/frontend.css"/>

<d:layout.section frame="{data.frame_class}" spaceBefore="{data.space_before_class}" spaceAfter="{data.space_after_class}" class="partner-grid">
    <d:layout.container>
        <f:if condition="{data.header} || {data.subheadline}">
            <d:molecule.sectionIntro prefix="partner-grid" class="partner-grid__intro" leadVariant="lead">
                <f:fragment name="heading"><f:if condition="{data.header}">{data -> f:render.text(field: 'header')}</f:if></f:fragment>
                <f:fragment name="lead"><f:if condition="{data.subheadline}">{data -> f:render.text(field: 'subheadline')}</f:if></f:fragment>
            </d:molecule.sectionIntro>
        </f:if>

        <ul class="partner-grid__items" role="list">
            <f:for each="{data.partners}" as="item">
                <li class="partner-grid__item">
                    <div class="partner-grid__logo-wrap">
                        <f:if condition="{item.logo}">
                            <f:then>
                                <f:for each="{item.logo}" as="fileReference">
                                    <f:image image="{fileReference}" maxHeight="64" alt="" loading="lazy" decoding="async" class="partner-grid__logo"/>
                                </f:for>
                            </f:then>
                            <f:else>
                                <span class="partner-grid__logo-fallback" aria-hidden="true">{item.name -> f:format.crop(maxCharacters: 1)}</span>
                            </f:else>
                        </f:if>
                    </div>
                    <d:atom.typography tag="h3" variant="h3" class="partner-grid__name">{item -> f:render.text(field: 'name')}</d:atom.typography>
                    <f:if condition="{item.kind}">
                        <d:atom.badge variant="secondary" class="partner-grid__kind">{item -> f:render.text(field: 'kind')}</d:atom.badge>
                    </f:if>
                    <f:if condition="{item.link.url}">
                        <d:atom.link href="{f:uri.typolink(parameter: item.link.url)}" target="{item.link.target}" variant="muted" class="partner-grid__link">
                            <f:translate key="LLL:EXT:desiderio/Resources/Private/Language/labels.xlf:investor.visit"/>
                            <span class="sr-only">: {item -> f:render.text(field: 'name')}</span>
                            <span class="partner-grid__link-arrow" aria-hidden="true">&rarr;</span>
                        </d:atom.link>
                    </f:if>
                </li>
            </f:for>
        </ul>
    </d:layout.container>
</d:layout.section>

</html>
