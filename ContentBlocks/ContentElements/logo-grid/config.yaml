name: desiderio/logo-grid
typeName: desiderio_logogrid
title: 'Logo Grid'
description: 'Renders a tidy grid of client logos in three, four, or five uniform cells, each logo optionally linked, with an eyebrow and heading above and a checkbox to show company names beneath the marks. Use it for: ''our clients'' or ''our partners'' strips, sponsor rows, press and certification logos where consistent sizing matters. Prefer ''Logo Cloud'' for a looser layout with always-visible names, ''Logo Carousel'' for an auto-scrolling strip.'
group: social-proof
prefixFields: false
basics:
  - TYPO3/Appearance
  - TYPO3/Links
  - TYPO3/Categories
fields:
  -
    identifier: header
    useExistingField: true
    label: 'LLL:EXT:desiderio/Resources/Private/Language/labels.xlf:heading'
  -
    identifier: eyebrow
    type: Textarea
    rows: 1
    label: 'LLL:EXT:desiderio/Resources/Private/Language/labels.xlf:eyebrow'
  -
    identifier: columns
    type: Select
    renderType: selectSingle
    label: 'LLL:EXT:desiderio/Resources/Private/Language/labels.xlf:columns'
    items:
      -
        label: 'LLL:EXT:desiderio/Resources/Private/Language/labels.xlf:item.3_columns'
        value: '3'
      -
        label: 'LLL:EXT:desiderio/Resources/Private/Language/labels.xlf:item.4_columns'
        value: '4'
      -
        label: '5 Columns'
        value: '5'
    default: '4'
  -
    identifier: show_names
    type: Checkbox
    label: 'Show Company Names'
    default: 0
  -
    identifier: logo_items
    type: Collection
    foreign_table: desiderio_logo_item
    shareAcrossTables: true
    shareAcrossFields: true
    prefixField: true
    label: Logos
    minItems: 1