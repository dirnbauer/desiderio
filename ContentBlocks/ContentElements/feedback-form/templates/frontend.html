<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      xmlns:cb="http://typo3.org/ns/TYPO3/CMS/ContentBlocks/ViewHelpers"
      xmlns:d="http://typo3.org/ns/Webconsulting/Desiderio/Components/ComponentCollection"
      data-namespace-typo3-fluid="true">

<f:asset.css identifier="d-feedback-form" href="{cb:assetPath()}/frontend.css"/>

<d:layout.section frame="{data.frame_class}" spaceBefore="{data.space_before_class}" spaceAfter="{data.space_after_class}" class="feedback-form">
    <d:layout.container>
        <d:molecule.card class="feedback-form__card">
            <f:if condition="{data.header} || {data.description}">
                <d:molecule.sectionIntro prefix="feedback-form" class="feedback-form__intro" leadClass="d-richtext" leadTag="div">
                    <f:fragment name="heading"><f:if condition="{data.header}">{data -> f:render.text(field: 'header')}</f:if></f:fragment>
                    <f:fragment name="lead"><f:if condition="{data.description}">{data -> f:render.text(field: 'description')}</f:if></f:fragment>
                </d:molecule.sectionIntro>
            </f:if>

            <d:molecule.formRenderer persistenceIdentifier="EXT:desiderio/Resources/Private/Forms/DesiderioFeedback.form.yaml" class="feedback-form__form"/>
        </d:molecule.card>
    </d:layout.container>
</d:layout.section>

</html>
