<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      xmlns:cb="http://typo3.org/ns/TYPO3/CMS/ContentBlocks/ViewHelpers"
      xmlns:d="http://typo3.org/ns/Webconsulting/Desiderio/Components/ComponentCollection"
      data-namespace-typo3-fluid="true">

<f:asset.css identifier="d-feature-bento" href="{cb:assetPath()}/frontend.css"/>

<d:layout.section frame="{data.frame_class}" spaceBefore="{data.space_before_class}" spaceAfter="{data.space_after_class}" class="feature-bento">
    <d:layout.container>
        <f:if condition="{data.header}">
            <d:molecule.sectionIntro prefix="feature-bento" align="center" leadVariant="lead" class="feature-bento__intro" leadClass="feature-bento__subheadline">
                <f:fragment name="heading">{data -> f:render.text(field: 'header')}</f:fragment>
                <f:fragment name="lead"><f:if condition="{data.subheadline}">{data -> f:render.text(field: 'subheadline')}</f:if></f:fragment>
            </d:molecule.sectionIntro>
        </f:if>

        <div class="feature-bento__grid">
            <f:for each="{data.items}" as="item">
                <f:variable name="bentoCardSize" value="sm"/>
                <f:if condition="{item.size} == 'wide' || {item.size} == 'tall'"><f:variable name="bentoCardSize" value="default"/></f:if>
                <d:molecule.card size="{bentoCardSize}" class="feature-bento__item feature-bento__item--{item.size -> f:or(alternative: 'small')}">
                    <f:if condition="{item.image.0}">
                        <div class="feature-bento__bg">
                            <f:image image="{item.image.0}" alt="{item.image.0.alternative}" maxWidth="800" class="feature-bento__bg-image" loading="lazy" decoding="async"/>
                        </div>
                    </f:if>
                    <div class="feature-bento__content gap-1.5">
                        <d:atom.typography tag="h3" variant="large" class="feature-bento__title">{item -> f:render.text(field: 'title')}</d:atom.typography>
                        <f:if condition="{item.description}">
                            <div class="feature-bento__description d-richtext">{item -> f:render.text(field: 'description')}</div>
                        </f:if>
                    </div>
                </d:molecule.card>
            </f:for>
        </div>
    </d:layout.container>
</d:layout.section>

</html>
