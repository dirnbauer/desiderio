<html
    xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
    xmlns:d="http://typo3.org/ns/Webconsulting/Desiderio/Components/ComponentCollection"
    data-namespace-typo3-fluid="true"
>

<f:layout name="Post" />

<f:section name="Content">
    <f:if condition="{settings.comments.active}">
        <f:if condition="{comments}">
            <f:variable name="commentCount" value="{comments -> f:count()}"/>
        </f:if>
        <section class="scroll-mt-24" id="comments" aria-labelledby="comments-title">
            <d:layout.stack gap="md">
                <header class="flex flex-wrap items-center gap-2">
                    <d:atom.typography tag="h2" variant="h3" class="text-balance" attributes="{id: 'comments-title'}">
                        <f:translate extensionName="Blog" key="headline.comments">Comments</f:translate>
                    </d:atom.typography>
                    <f:if condition="{comments}">
                        <d:atom.badge variant="outline">
                            <span data-icon="inline-start" aria-hidden="true"><d:atom.icon name="message-circle" size="xs"/></span>
                            <span>
                                <f:translate key="blog.comments.count" extensionName="desiderio" arguments="{count: commentCount}">
                                    {commentCount} comments
                                </f:translate>
                            </span>
                        </d:atom.badge>
                    </f:if>
                </header>

                <f:if condition="{settings.comments.disqus.enable} !== '1'">
                    <f:if condition="{comments}">
                        <f:then>
                            <ol role="list" class="flex flex-col gap-6">
                                <f:for each="{comments}" as="comment">
                                    <li><f:render partial="Comments/Comment" arguments="{comment: comment, settings: settings}"/></li>
                                </f:for>
                            </ol>
                        </f:then>
                        <f:else>
                            <f:comment>
                                The title already says there are none (EXT:blog's
                                message.no_comments repeated it as "No Comments"), so
                                the description offers the next step: the form below,
                                or the note that this post takes no comments.
                            </f:comment>
                            <d:molecule.alert class="bg-muted/40">
                                <d:atom.icon name="message-circle" size="sm"/>
                                <d:molecule.alertTitle><f:translate extensionName="Blog" key="comments.empty.title">No comments yet</f:translate></d:molecule.alertTitle>
                                <d:molecule.alertDescription>
                                    <f:if condition="{post.commentsActive}">
                                        <f:then><a href="#postcommentform-{post.uid}"><f:translate extensionName="Blog" key="headline.commentform">Write comment</f:translate></a></f:then>
                                        <f:else><f:translate extensionName="Blog" key="message.comments_closed">Comments are closed.</f:translate></f:else>
                                    </f:if>
                                </d:molecule.alertDescription>
                            </d:molecule.alert>
                        </f:else>
                    </f:if>
                </f:if>
            </d:layout.stack>
        </section>
    </f:if>
</f:section>

</html>
