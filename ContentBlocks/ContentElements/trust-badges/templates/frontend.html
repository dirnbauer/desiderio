<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      xmlns:cb="http://typo3.org/ns/TYPO3/CMS/ContentBlocks/ViewHelpers"
      xmlns:d="http://typo3.org/ns/Webconsulting/Desiderio/Components/ComponentCollection"
      data-namespace-typo3-fluid="true">

<f:asset.css identifier="d-trust-badges" href="{cb:assetPath()}/frontend.css"/>

<d:layout.section frame="{data.frame_class}" spaceBefore="{data.space_before_class}" spaceAfter="{data.space_after_class}" class="trust-badges">
    <d:layout.container>
        <f:if condition="{data.header} || {data.subheadline}">
            <header class="trust-badges__intro">
                <f:if condition="{data.header}">
                    <d:atom.typography tag="h2" variant="h2" class="trust-badges__headline">{data -> f:render.text(field: 'header')}</d:atom.typography>
                </f:if>
                <f:if condition="{data.subheadline}">
                    <p class="trust-badges__description">{data -> f:render.text(field: 'subheadline')}</p>
                </f:if>
            </header>
        </f:if>

        <ul class="trust-badges__row" role="list">
            <f:for each="{data.badge_items}" as="badge">
                <li class="trust-badges__item">
                    <f:if condition="{badge.icon_name} && {badge.icon_name} != 'none'">
                        <f:then>
                            <span class="trust-badges__seal" aria-hidden="true"><d:atom.icon name="{badge.icon_name}" size="lg"/></span>
                        </f:then>
                        <f:else>
                            <f:if condition="{badge.image}">
                                <span class="trust-badges__icon">
                                    <f:for each="{badge.image}" as="fileReference">
                                        <f:image image="{fileReference}" width="240m" height="160m" alt="{fileReference.alternative}" class="trust-badges__icon-img" additionalAttributes="{srcset: '{f:uri.image(image: fileReference, width: \'240m\', height: \'160m\')} 1x, {f:uri.image(image: fileReference, width: \'480m\', height: \'320m\')} 2x'}" loading="lazy" decoding="async"/>
                                    </f:for>
                                </span>
                            </f:if>
                        </f:else>
                    </f:if>
                    <span class="trust-badges__label">{badge -> f:render.text(field: 'label')}</span>
                    <f:if condition="{badge.description_text}">
                        <span class="trust-badges__desc">{badge -> f:render.text(field: 'description_text')}</span>
                    </f:if>
                </li>
            </f:for>
        </ul>
    </d:layout.container>
</d:layout.section>
</html>
