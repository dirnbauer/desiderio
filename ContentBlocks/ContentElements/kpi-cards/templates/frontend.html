<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      xmlns:cb="http://typo3.org/ns/TYPO3/CMS/ContentBlocks/ViewHelpers"
      xmlns:d="http://typo3.org/ns/Webconsulting/Desiderio/Components/ComponentCollection"
      data-namespace-typo3-fluid="true">

<f:asset.css identifier="d-kpi-cards" href="{cb:assetPath()}/frontend.css"/>

<d:layout.section frame="{data.frame_class}" spaceBefore="{data.space_before_class}" spaceAfter="{data.space_after_class}" class="kpi-cards">
    <d:layout.container>
        <f:if condition="{data.eyebrow} || {data.header} || {data.subheadline}">
            <d:molecule.sectionIntro prefix="kpi-cards" class="kpi-cards__intro" headingClass="kpi-cards__headline" leadVariant="lead" leadClass="kpi-cards__description">
                <f:fragment name="eyebrow"><f:if condition="{data.eyebrow}">{data -> f:render.text(field: 'eyebrow')}</f:if></f:fragment>
                <f:fragment name="heading"><f:if condition="{data.header}">{data -> f:render.text(field: 'header')}</f:if></f:fragment>
                <f:fragment name="lead"><f:if condition="{data.subheadline}">{data -> f:render.text(field: 'subheadline')}</f:if></f:fragment>
            </d:molecule.sectionIntro>
        </f:if>

        <div class="kpi-cards__grid kpi-cards__grid--cols-{data.columns -> f:or(alternative: '4')}">
            <f:for each="{data.items}" as="item">
                <article class="kpi-cards__item kpi-cards__item--{item.trend -> f:or(alternative: 'positive')}">
                    <d:molecule.stat prefix="kpi-cards" trend="{item.trend -> f:or(alternative: 'positive')}" labelTag="h3">
                        <f:fragment name="value">{item -> f:render.text(field: 'value')}</f:fragment>
                        <f:fragment name="label">{item -> f:render.text(field: 'label')}</f:fragment>
                    </d:molecule.stat>
                    <f:if condition="{item.detail_text}">
                        <p class="kpi-cards__detail">{item -> f:render.text(field: 'detail_text')}</p>
                    </f:if>
                </article>
            </f:for>
        </div>
    </d:layout.container>
</d:layout.section>

</html>
