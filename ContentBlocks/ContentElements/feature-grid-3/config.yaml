name: desiderio/feature-grid-3
typeName: desiderio_featuregrid3
title: '3-Column Feature Grid'
description: 'Renders a heading and subheadline above a three-column grid of cards, each with an icon, an optionally linked title, and a rich-text description (minimum three items). Use it for: the classic ''three pillars'' section — services, benefits, or product capabilities of similar weight on home and landing pages. Prefer ''4-Column Feature Grid'' for many short entries; ''Feature Cards Grid'' when features have no icons; ''Icon Feature Grid'' for selectable column counts.'
group: features
prefixFields: false
basics:
  - TYPO3/Appearance
  - TYPO3/Links
  - TYPO3/Categories
fields:
  -
    identifier: header
    useExistingField: true
    label: 'LLL:EXT:desiderio/Resources/Private/Language/labels.xlf:heading'
  -
    identifier: subheadline
    type: Textarea
    label: 'LLL:EXT:desiderio/Resources/Private/Language/labels.xlf:subheadline'
    rows: 2
  -
    identifier: items
    type: Collection
    foreign_table: desiderio_icon_card_link
    shareAcrossTables: true
    shareAcrossFields: true
    prefixField: true
    label: 'LLL:EXT:desiderio/Resources/Private/Language/labels.xlf:features'
    minItems: 3