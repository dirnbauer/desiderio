name: desiderio/analytics-overview
typeName: desiderio_analyticsoverview
title: 'Analytics Overview'
description: 'Renders one card holding a row of headline metrics as a definition list — each with label, value, and optional change figure with a colored up/down/neutral trend arrow — plus a period badge and rich-text summary. Use it for: report summaries, monthly figures with growth percentages, traffic or sales snapshots in source documents. Prefer ''KPI Cards'' for one card per metric, ''Metric Dashboard'' when a chart is needed, ''Stats Section'' for plain marketing numbers.'
group: data
prefixFields: false
basics:
  - Desiderio/Appearance
  - TYPO3/Links
  - TYPO3/Categories
fields:
  -
    identifier: header
    useExistingField: true
    label: 'LLL:EXT:desiderio/Resources/Private/Language/labels.xlf:heading'
  -
    identifier: period_label
    type: Textarea
    rows: 1
    label: 'Period Label'
    description: 'e.g. Last 30 days'
  -
    identifier: items
    type: Collection
    foreign_table: desiderio_metric_item
    shareAcrossTables: true
    shareAcrossFields: true
    prefixField: true
    label: 'Key Metrics'
    minItems: 1
  -
    identifier: summary
    type: Textarea
    enableRichtext: true
    richtextConfiguration: desiderio
    label: 'Summary Text'
    rows: 3
