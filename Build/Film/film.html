<title>Desiderio product film</title>
<!--
  The Desiderio product film: 89 seconds at 1600 × 900 (16:9, the ratio of
  the Video Feature Section and of most players). It sells the package in
  six numbered features, each explained over real screens, framed by a
  problem opener, a recap and the plans.

  Every motion is one paused Web Animation or a pure function of the time
  (the aura, the grain, the counters, the cursor), so `seek(ms)` puts the
  whole film on an exact frame: Build/Scripts/render-film.mjs steps through
  it at 30 fps in headless Chromium and ffmpeg encodes the frames. Open the
  file in a browser and add #play to watch it in real time, or #t=33000 to
  hold one frame.

  The pictures are real: Build/Scripts/capture-film-assets.mjs takes them from
  the seeded showcase (one chart in all 15 presets, dark mode, the homepage
  in four languages, a wall of content elements) into Build/Film/assets/,
  which git ignores. The editor and extension screens are the committed
  styleguide screenshots. The colour pairs, fonts, corners and icon
  libraries in FILM are the presets' own values (shadcn-theme.css and the
  preset overview); every number is one of canon.yaml's facts.

  Copy, timings and colours live in FILM below; the narration and its
  timing in audio/narration.json (Build/Scripts/generate-film-audio.mjs).
-->

function buildOpen() {
  const [, end] = S.open;
  const layer = node('section', 'layer');
  text('h1', 'headline', layer, FILM.open.first, 600, 90, [3700, 4150]).style.top = '104px';
  text('h1', 'headline', layer, FILM.open.second, 4350, 80, [7900, 8350]).style.top = '104px';

  const wires = node('div', 'wires', layer);
  const row = node('div', 'wire-row', wires);
  ['hero', 'pricing', 'footer'].forEach((kind, i) => {
    const wire = node('div', 'wire', row);
    wire.style.left = `${i * 400}px`;
    // Copies behind each sketch: the same section, one relaunch after another.
    for (let k = 4; k >= 1; k--) {
      const ghost = node('div', 'ghost', wire, `<svg viewBox="0 0 340 420">${WIRES[kind]}</svg>`);
      const t = 4500 + (4 - k) * 520 + i * 90;
      track(ghost, [[t, { opacity: 0, transform: 'translate3d(0px, 0px, 0px)' }, OUT], [t + 700, { opacity: 0.5 / k, transform: `translate3d(${k * 16}px, ${-k * 16}px, ${-k * 70}px)` }], [8200, { opacity: 0.5 / k, transform: `translate3d(${k * 16}px, ${-k * 16}px, ${-k * 70}px)` }]]);
    }
    const sketch = node('div', 'draw', wire, `<svg viewBox="0 0 340 420">${WIRES[kind]}</svg>`);
    [...sketch.querySelectorAll('svg *')].forEach((shape, n, all) => {
      shape.setAttribute('pathLength', '1');
      const t = 1300 + i * 380 + (n / all.length) * 1500;
      track(shape, [[t, { strokeDashoffset: 1 }, SOFT], [t + 700, { strokeDashoffset: 0 }]]);
    });
    const label = node('div', 'wire-label', wire, FILM.open.labels[i].toUpperCase());
    life(label, 2000 + i * 380, null, { from: { y: 10 }, blur: 4, inDur: 600 });
  });
  // The whole set breathes, then falls into one point: the brand's dot.
  track(row, [[1000, { transform: 'rotateX(16deg) rotateY(-19deg) translateZ(-40px)' }, 'linear'], [8200, { transform: 'rotateX(12deg) rotateY(-11deg) translateZ(30px)' }]]);
  track(wires, [[0, { opacity: 1, transform: 'scale(1)', filter: 'blur(0px)' }], [8200, { opacity: 1, transform: 'scale(1)', filter: 'blur(0px)' }, 'cubic-bezier(0.7, 0, 0.84, 0)'], [9150, { opacity: 0, transform: 'scale(0.03)', filter: 'blur(16px)' }]]);

  const relaunch = node('div', 'relaunch', layer, 'Relaunch <b>01</b>');
  life(relaunch, 4500, 8400, { from: { y: 10 }, blur: 4 });
  custom.push((t) => {
    const n = clamp(Math.floor((t - 4500) / 290) + 1, 1, FILM.open.relaunches);
    relaunch.lastChild.textContent = String(n).padStart(2, '0');
  });

  const core = node('div', 'core', layer);
  track(core, [[8700, { opacity: 0, transform: 'scale(0.3)' }, OUT], [9300, { opacity: 1, transform: 'scale(1)' }], [end, { opacity: 1, transform: 'scale(1)' }], [end + 1, { opacity: 0, transform: 'scale(1)' }]]);
}

function buildTitle() {
  const [start, end] = S.title;
  const layer = node('section', 'layer title');
  const row = node('div', 'title-row', layer);
  const mark = node('span', 'mark', row, '<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="46" pathLength="100" stroke-dasharray="100" /></svg><span class="dot"></span>');
  mark.style.setProperty('--size', '112px');
  const word = node('div', 'wordmark', row);
  const letters = splitInto(word, FILM.title.word, 'letter');
  const sub = node('div', 'subline', layer, FILM.title.sub);

  // The mark starts alone in the middle, where the opener's point landed,
  // then slides aside for the name.
  const rowBox = row.getBoundingClientRect();
  const markBox = mark.getBoundingClientRect();
  const dx = 800 - (markBox.left + markBox.width / 2);
  const dy = 450 - (markBox.top + markBox.height / 2);
  track(mark, [[start, { transform: `translate(${dx}px, ${dy}px)` }], [start + 900, { transform: `translate(${dx}px, ${dy}px)` }, 'cubic-bezier(0.65, 0, 0.35, 1)'], [start + 1800, { transform: 'translate(0px, 0px)' }]]);
  track(mark.querySelector('circle'), [[start, { strokeDashoffset: 100 }, OUT], [start + 1000, { strokeDashoffset: 0 }]]);
  track(mark.querySelector('.dot'), [[start, { transform: 'scale(0.42)' }, OUT], [start + 700, { transform: 'scale(1)' }]]);
  rise(letters, start + 1250, 48, null, { y: 0.36, blur: 12, duration: 760 });
  life(sub, start + 2000, null, { from: { y: 14 }, blur: 6 });

  // A light runs through the letters once they have landed.
  // The gradient is 1600 px wide with its highlight in the middle; each
  // letter shifts it by its own offset, so the highlight crosses the word
  // as one band.
  letters.forEach((span) => span.style.setProperty('--x', `${span.offsetLeft}px`));
  const wordLeft = word.offsetLeft;
  const wordRight = wordLeft + word.offsetWidth;
  custom.push((t) => {
    const p = smooth((t - (start + 2500)) / 1500);
    word.style.setProperty('--sweep', `${lerp(wordRight - 1600, wordLeft, p)}px`);
  });
  track(layer, [[start - 1, { opacity: 0, transform: 'scale(1)', filter: 'blur(0px)' }], [start, { opacity: 1, transform: 'scale(1)', filter: 'blur(0px)' }], [end - 700, { opacity: 1, transform: 'scale(1)', filter: 'blur(0px)' }, INOUT], [end, { opacity: 0, transform: 'scale(0.94)', filter: 'blur(10px)' }]]);
  return rowBox;
}

const SPOTS = [0, 1, 2, 3, 4, 5].map((i) => [(i % 3) * 474, Math.floor(i / 3) * 256]);
function buildSix([start, end], { head, checks }) {
  const layer = node('section', 'layer');
  const headline = node('div', 'six-head', layer);
  const h2 = node('h2', 'h2', headline);
  rise(splitInto(h2, head, 'word'), start + 200, 70, [end - 600, end - 200], { y: 0.4, blur: 8, duration: 620 });
  const grid = node('div', 'six', layer);
  FILM.six.items.forEach((item, i) => {
    const card = node('div', 'six-card glass', grid, `<div class="six-top"><span class="six-num">${String(i + 1).padStart(2, '0')}</span><span class="six-icon">${svg(item.icon)}</span></div><div class="six-title">${item.title}</div><div class="six-text">${item.text}</div>`);
    place(card, ...SPOTS[i]);
    const t = start + (checks ? 250 : 650) + i * (checks ? 70 : 140);
    life(card, t, end - 120 + i * 20 - 120, { from: { y: 46, rx: -22, z: -60, s: 0.96 }, exit: checks ? { y: 30, s: 0.97 } : { z: 160, s: 1.06 }, blur: 12, inDur: 760, outDur: 520 });
    if (checks) {
      const check = node('div', 'six-check', card, svg('check'));
      card.querySelector('.six-icon').style.opacity = '0';
      const tc = start + 900 + i * 230;
      track(check, [[tc, { opacity: 0, transform: 'scale(0.6)' }, OUT], [tc + 380, { opacity: 1, transform: 'scale(1)' }]]);
      track(check.querySelector('path'), [[tc + 120, { strokeDashoffset: 1 }, OUT], [tc + 520, { strokeDashoffset: 0 }]]);
      track(card.querySelector('.six-num'), [[tc, { webkitTextStrokeColor: 'rgba(255,255,255,0.55)' }], [tc + 300, { webkitTextStrokeColor: 'rgba(74,222,128,0.9)' }]]);
    }
  });
  return layer;
}

function buildHud() {
  const chapters = [S.elements, S.presets, S.editing, S.extensions, S.a11y, S.languages];
  const hud = node('div', 'hud', stage, '<div class="hud-line"><b>01</b><span>/ 06</span><em></em></div><div class="hud-bars"></div>');
  const bars = hud.querySelector('.hud-bars');
  chapters.forEach(() => node('i', '', bars, '<s></s>'));
  const brand = node('div', 'hud-brand', stage, '<span class="mark" style="--size:26px"><svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="44" /></svg><span class="dot" style="box-shadow:none"></span></span>Desiderio');
  const tIn = chapters[0][0];
  const tOut = chapters[5][1];
  life(hud, tIn + 200, tOut, { from: { y: -10 }, exit: { y: -10 }, blur: 4 });
  life(brand, tIn + 200, tOut, { from: { y: -10 }, exit: { y: -10 }, blur: 4 });
  const number = hud.querySelector('b');
  const title = hud.querySelector('em');
  custom.push((t) => {
    let index = chapters.findIndex(([a, b]) => t >= a && t < b);
    if (index < 0) index = t < tIn ? 0 : 5;
    const [a, b] = chapters[index];
    number.textContent = String(index + 1).padStart(2, '0');
    title.textContent = FILM.chapters[index];
    const p = clamp((t - a - 150) / 450);
    title.style.opacity = String(index === 0 ? 1 : ease(p));
    title.style.transform = `translateY(${index === 0 ? 0 : (1 - ease(p)) * 8}px)`;
    [...bars.children].forEach((bar, i) => {
      const fill = i < index ? 1 : i > index ? 0 : clamp((t - a) / (b - a));
      bar.firstChild.style.transform = `scaleX(${fill})`;
    });
  });
}

}

// 4 · 02 Theme presets, then light and dark (29.6 – 40.2 s)
// ---------------------------------------------------------------------------
function buildPresets() {
  const [start, end] = S.presets;
  const P = FILM.presets;
  const layer = node('section', 'layer persp');
  const { box, view, url, edge } = frame(layer, 90, 140, 1000, 665, 'example.com');
  track(box, [
    [start, { opacity: 0, transform: pose({ y: 70, z: -160, ry: 26, rx: 4 }), filter: 'blur(12px)' }, OUT],
    [start + 900, { opacity: 1, transform: pose({ ry: 9, rx: 2 }), filter: 'blur(0px)' }, 'linear'],
    [end - 500, { opacity: 1, transform: pose({ ry: 3, rx: 1 }), filter: 'blur(0px)' }, INOUT],
    [end, { opacity: 0, transform: pose({ y: -30, ry: 3, s: 0.96 }), filter: 'blur(8px)' }],
  ]);
  const cycle0 = start + 600;
  const slot = 330;
  const cycleEnd = cycle0 + slot * P.order.length;
  P.order.forEach((preset, i) => {
    const img = picture(`assets/charts/charts-10-light-${preset}.png`, view);
    Object.assign(img.style, { left: '-125px', width: '1250px', height: '781px', objectFit: 'fill' });
    const t = cycle0 + i * slot;
    track(img, i === 0 ? [[0, { opacity: 1 }], [1, { opacity: 1 }]] : [[t, { opacity: 0 }], [t + 60, { opacity: 1 }]]);
  });
  const dark = picture(`assets/charts/charts-10-dark-${P.dark}.png`, view);
  Object.assign(dark.style, { left: '-125px', width: '1250px', height: '781px', objectFit: 'fill' });
  const wipe = cycleEnd + 1400;
  track(dark, [[wipe, { clipPath: 'inset(0 100% 0 0)' }, INOUT], [wipe + 1000, { clipPath: 'inset(0 0% 0 0)' }]]);
  track(edge, [[wipe, { opacity: 0, transform: 'translateX(0px)' }, INOUT], [wipe + 60, { opacity: 1, transform: 'translateX(40px)' }, INOUT], [wipe + 1000, { opacity: 1, transform: 'translateX(1000px)' }], [wipe + 1080, { opacity: 0, transform: 'translateX(1000px)' }]]);

  // The preset panel: name, number, colour and the values that change.
  const panel = node('div', 'panel', layer, '<div class="eyebrow">Theme preset</div><div class="name"></div><div class="of"></div><div class="bar"></div><div class="spec"><div><small>Type</small><span></span></div><div><small>Corners</small><span></span></div><div><small>Icons</small><span></span></div></div><div class="setting">desiderio.shadcn.preset: <b></b></div>');
  const [nameEl, ofEl, barEl] = ['.name', '.of', '.bar'].map((q) => panel.querySelector(q));
  const values = [...panel.querySelectorAll('.spec span')];
  const settingValue = panel.querySelector('.setting b');
  life(panel, start + 400, cycleEnd + 700, { from: { x: 30 }, exit: { x: -20 }, blur: 8 });
  const tints = P.order.map((p) => oklch(COLORS_FALLBACK[p] ?? 'oklch(55% 0 0)'));
  const indexAt = (t) => clamp(Math.floor((t - cycle0) / slot), 0, P.order.length - 1);
  custom.push((t) => {
    const i = indexAt(t);
    const key = P.order[i];
    const [name, type, corners, icons] = P.spec[key];
    nameEl.textContent = name;
    ofEl.textContent = `${String(i + 1).padStart(2, '0')} / ${P.order.length}`;
    barEl.style.background = `rgb(${tints[i].join(',')})`;
    const since = t - (cycle0 + i * slot);
    [type, corners, icons].forEach((value, n) => {
      const el = values[n];
      el.textContent = value;
      const p = i === 0 && t < cycle0 + slot ? 1 : ease((since - n * 30) / 220);
      el.style.opacity = String(0.25 + 0.75 * p);
      el.style.transform = `translateY(${(1 - p) * 12}px)`;
    });
    settingValue.textContent = key;
    url.textContent = t < wipe ? `example.com/?preset=${key}` : `example.com/?preset=${P.dark}&mode=dark`;
  });
  presetTint = {
    rgb: (t) => tints[indexAt(t)],
    weight: (t) => smooth((t - cycle0 + 200) / 600) * (1 - smooth((t - cycleEnd + 200) / 900)),
  };

  // Light and dark: a switch that flips with the wipe.
  const darkPanel = node('div', 'panel', layer, `<div class="eyebrow">Colour mode</div><div class="name" style="white-space:normal">${P.darkHead}</div><p class="lead" style="margin-top:14px">${P.darkSub}</p><div class="toggle"><i><span class="sun">${svg('sun')}</span><span class="moon">${svg('moon')}</span></i></div>`);
  life(darkPanel, cycleEnd + 700, end, { from: { x: 30 }, exit: { y: -16 }, blur: 8 });
  const knob = darkPanel.querySelector('.toggle i');
  track(knob, [[wipe, { transform: 'translateX(0px)', background: '#fafafa' }, INOUT], [wipe + 700, { transform: 'translateX(68px)', background: '#c4b5fd' }]]);
  track(darkPanel.querySelector('.sun svg'), [[wipe, { opacity: 1, transform: 'rotate(0deg) scale(1)' }, INOUT], [wipe + 500, { opacity: 0, transform: 'rotate(90deg) scale(0.6)' }]]);
  track(darkPanel.querySelector('.moon svg'), [[wipe + 200, { opacity: 0, transform: 'rotate(-90deg) scale(0.6)', color: '#1e1b4b' }, OUT], [wipe + 700, { opacity: 1, transform: 'rotate(0deg) scale(1)', color: '#1e1b4b' }]]);
}

  b0: 'oklch(20.5% 0 0)', b4hb38Fyj: 'oklch(51.1% .096 186.391)', b3IWPgRwnI: 'oklch(50% .134 242.749)', b6G5977cw: 'oklch(22.8% .013 107.4)', b27GcrRo: 'oklch(20.5% 0 0)',
  aurora: 'oklch(55.4% .2 293)', marine: 'oklch(53.9% .2 259)', forest: 'oklch(48.4% .2 158)', ember: 'oklch(54.5% .2 55)', bloom: 'oklch(55.4% .2 12)',
  lagoon: 'oklch(46.8% .2 185)', gold: 'oklch(53.3% .16 85)', midnight: 'oklch(54.7% .2 275)', blossom: 'oklch(55.6% .2 350)', citrus: 'oklch(51.8% .16 130)',
};

// ---------------------------------------------------------------------------
// 5 · 03 Editing on the page (40.2 – 49.2 s)
// ---------------------------------------------------------------------------
function buildEditing() {
  const [start, end] = S.editing;
  const D = FILM.editing;
  const layer = node('section', 'layer persp');
  const FX = 90;
  const FY = 130;
  const { box, view, url } = frame(layer, FX, FY, 1040, 690, 'example.com/typo3/module/web/edit');
  url.textContent = 'example.com/typo3 · Content › Editor';
  track(box, [
    [start, { opacity: 0, transform: pose({ y: 60, z: -120, rx: 10 }), filter: 'blur(12px)' }, OUT],
    [start + 800, { opacity: 1, transform: pose({}), filter: 'blur(0px)' }],
    [end - 500, { opacity: 1, transform: pose({}), filter: 'blur(0px)' }, INOUT],
    [end, { opacity: 0, transform: pose({ y: -30, s: 0.96 }), filter: 'blur(8px)' }],
  ]);
  // Three screens, each zoomed towards what the cursor works on.
  // [screen, in, zoom origin in the view, scale]
  const shots = [[0, start, [430, 300], 1.08], [1, start + 3100, [394, 360], 1.3], [2, start + 5700, [470, 380], 1.3]];
  shots.forEach(([n, t, [ox, oy], s], i) => {
    const img = picture(D.screens[n], view);
    img.style.transformOrigin = `${ox}px ${oy}px`;
    const next = shots[i + 1]?.[1];
    const steps = [[t, { opacity: i === 0 ? 1 : 0, transform: 'scale(1)', filter: 'blur(0px)' }, 'cubic-bezier(0.65, 0, 0.35, 1)'], [t + (i === 0 ? 1 : 400), { opacity: 1, transform: 'scale(1)', filter: 'blur(0px)' }, 'cubic-bezier(0.65, 0, 0.35, 1)'], [t + 1500, { opacity: 1, transform: `scale(${s})`, filter: 'blur(0px)' }]];
    if (next) steps.push([next + 400, { opacity: 1, transform: `scale(${s})`, filter: 'blur(0px)' }]);
    track(img, steps);
  });
  // Where a point of a zoomed screen lands on the stage.
  const at = ([ox, oy], s, [qx, qy]) => [FX + ox + s * (qx - ox), FY + 40 + oy + s * (qy - oy)];
  const targets = [
    at([430, 300], 1.08, [439, 292]),
    at([394, 360], 1.3, [390, 289]),
    at([470, 380], 1.3, [446, 370]),
  ];
  const clicks = [start + 2300, start + 4600, start + 7300];

  const ring = node('div', 'focus-ring', layer);
  const [rx0, ry0] = at([430, 300], 1.08, [325, 171]);
  const [rx1, ry1] = at([430, 300], 1.08, [553, 377]);
  place(ring, rx0, ry0, rx1 - rx0, ry1 - ry0);
  track(ring, [[clicks[0], { opacity: 0, transform: 'scale(1.06)' }, OUT], [clicks[0] + 300, { opacity: 1, transform: 'scale(1)' }], [shots[1][1], { opacity: 1, transform: 'scale(1)' }], [shots[1][1] + 300, { opacity: 0, transform: 'scale(1)' }]]);

  const cursor = node('div', 'cursor', layer, '<svg viewBox="0 0 30 36"><path d="M3 2v26l6.6-6.2 4.4 10.1 4.2-1.8-4.3-9.9h9.2z" fill="#fff" stroke="#111" stroke-width="1.6" stroke-linejoin="round"/></svg>');
  track(cursor, [[start + 600, { opacity: 0 }], [start + 900, { opacity: 1 }], [end - 500, { opacity: 1 }], [end - 200, { opacity: 0 }]]);
  // [time, x, y]: arrive just before each click, rest after it.
  const path = [[start + 600, 1010, 760], [clicks[0] - 120, ...targets[0]], [clicks[1] - 1300, ...targets[0]], [clicks[1] - 120, ...targets[1]], [clicks[2] - 1300, ...targets[1]], [clicks[2] - 120, ...targets[2]], [end, targets[2][0] + 30, targets[2][1] + 20]];
  custom.push((t) => {
    let i = 0;
    while (i < path.length - 2 && t >= path[i + 1][0]) i++;
    const [t0, x0, y0] = path[i];
    const [t1, x1, y1] = path[i + 1];
    const p = clamp((t - t0) / (t1 - t0));
    const k = p < 0.5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2;
    const press = clicks.some((c) => t >= c && t < c + 140) ? 0.86 : 1;
    cursor.style.transform = `translate(${lerp(x0, x1, k) - 3}px, ${lerp(y0, y1, k) - 2}px) scale(${press})`;
  });
  clicks.forEach((c, i) => {
    const ripple = node('div', 'ripple', layer);
    place(ripple, targets[i][0], targets[i][1]);
    track(ripple, [[c - 1, { opacity: 0, transform: 'scale(0.2)' }], [c, { opacity: 0.9, transform: 'scale(0.2)' }, OUT], [c + 650, { opacity: 0, transform: 'scale(1.4)' }]]);
  });

  const list = node('div', 'bullets', layer);
  const spans = [[start + 400, shots[1][1]], [shots[1][1], shots[2][1]], [shots[2][1], end]];
  D.bullets.forEach(([title, sub], i) => {
    const row = node('div', 'bullet', list, `<span class="tick">${svg('check')}<span class="tick-on">${svg('check')}</span></span><p>${title}<small>${sub}</small></p>`);
    life(row, start + 500 + i * 140, end, { from: { x: 30 }, exit: { y: -12 }, blur: 6 });
    const [a, b] = spans[i];
    track(row.querySelector('p'), [[start, { opacity: 0.38 }], [a, { opacity: 0.38 }, OUT], [a + 400, { opacity: 1 }], [end, { opacity: 1 }]]);
    track(row.querySelector('.tick-on'), [[a + 200, { opacity: 0, transform: 'scale(0.5)' }, OUT], [a + 600, { opacity: 1, transform: 'scale(1)' }]]);
  });
}

// ---------------------------------------------------------------------------
// 6 · 04 Extensions that match (49.2 – 57.0 s)
// ---------------------------------------------------------------------------
function buildExtensions() {
  const [start, end] = S.extensions;
  const X = FILM.extensions;
  const layer = node('section', 'layer persp');
  const mosaic = node('div', 'mosaic', layer);
  track(mosaic, [[start, { transform: 'rotateX(9deg) rotateY(-5deg)' }, 'linear'], [end, { transform: 'rotateX(2deg) rotateY(3deg)' }]]);
  const scatter = [{ x: -260, y: 80, z: -500, ry: 40, rx: 12 }, { x: 200, y: -140, z: -420, ry: -30, rx: -18 }, { x: 320, y: -60, z: -600, ry: -42, rx: 10 }, { x: 160, y: 180, z: -380, ry: -24, rx: 22 }, { x: 300, y: 160, z: -520, ry: -38, rx: -14 }];
  X.tiles.forEach(([src, label, [x, y, w, h]], i) => {
    const tile = node('div', 'tile', mosaic, `<em>${label}</em>`);
    tile.prepend(picture(src, tile));
    place(tile, x, y, w, h);
    life(tile, start + 300 + i * 170, end - 60 + i * 20 - 100, { from: scatter[i], exit: { z: 120, y: -20, s: 0.98 }, blur: 14, inDur: 1100, outDur: 460 });
  });
  const line = text('div', 'ext-line', layer, X.line, start + 1700, 55, [end - 500, end - 120], { y: 0.45, blur: 8, duration: 600 });
  line.style.whiteSpace = 'nowrap';
  const chips = node('div', 'ext-chips', layer);
  X.chips.forEach((label, i) => life(node('span', 'chip glass', chips, label), start + 2600 + i * 110, end - 100 + i * 10 - 60, { from: { y: 16, s: 0.95 }, blur: 6, inDur: 560, outDur: 360 }));
}

// ---------------------------------------------------------------------------
// 7 · 05 Accessible by default, then the parts (57.0 – 67.8 s)
// ---------------------------------------------------------------------------
function buildA11y() {
  const [start, end] = S.a11y;
  const A = FILM.a11y;
  const P = FILM.presets.order;
  const turn = start + 5600;
  const layer = node('section', 'layer');

  const head = node('div', 'a11y-head', layer, `<div class="display">${A.head}</div><p class="lead">${A.sub}</p>`);
  life(head.firstChild, start + 200, turn, { from: { y: 30, s: 0.97 }, exit: { y: -40 }, blur: 12, inDur: 800 });
  life(head.lastChild, start + 700, turn, { from: { y: 14 }, exit: { y: -30 }, blur: 6 });

  ['Light', 'Dark'].forEach((label, r) => {
    const tag = node('div', 'matrix-label', layer, label);
    tag.style.top = `${443 + r * 76}px`;
    life(tag, start + 900, turn, { from: { x: -10 }, exit: { y: -30 }, blur: 4 });
  });
  const matrix = node('div', 'matrix', layer);
  [0, 1].forEach((r) => P.forEach((preset, c) => {
    const [bg, fg] = A.pairs[preset][r];
    const cell = node('div', 'cell', matrix, `Aa<i>${svg('check')}</i>`);
    Object.assign(cell.style, { background: bg, color: fg });
    const t = start + 900 + c * 45 + r * 120;
    life(cell, t, turn + c * 12, { from: { y: 20, s: 0.85, rx: -30 }, exit: { y: -40 }, blur: 6, inDur: 560, outDur: 380 });
    const tick = cell.querySelector('i');
    const tc = start + 2100 + (c + r * 3) * 70;
    track(tick, [[tc, { opacity: 0, transform: 'scale(0.4)' }, OUT], [tc + 320, { opacity: 1, transform: 'scale(1)' }]]);
  }));
  const ratio = node('div', 'ratio', layer, A.ratio);
  life(ratio, start + 3000, turn, { from: { y: 10 }, exit: { y: -30 }, blur: 4 });

  // 62 typed components: the count, the split and the stack it runs on.
  const comp = node('div', 'comp', layer, `<b>0</b><span>${A.componentsLabel}<small>${A.componentsSub}</small></span>`);
  life(comp, turn + 300, end, { from: { y: 30 }, exit: { y: -20 }, blur: 10, inDur: 800 });
  custom.push((t) => { comp.firstChild.textContent = String(Math.round(A.components * ease((t - turn - 300) / 1500))); });
  const stack = node('div', 'stack', layer);
  const colours = ['#7c5cff', '#4f8dfd', '#22c3a6', '#f59e0b'];
  const total = A.split.reduce((sum, [, n]) => sum + n, 0);
  const width = 1420 - 8 * (A.split.length - 1);
  A.split.forEach(([label, n], i) => {
    const seg = node('div', 'seg', stack, n > 6 ? `${label}<small>${n}</small>` : `<span>${n}</span>`);
    Object.assign(seg.style, { width: `${(width * n) / total}px`, background: colours[i], color: i === 3 ? '#1c1300' : '#fff' });
    const t = turn + 900 + i * 260;
    track(seg, [[t, { opacity: 0, transform: 'scaleX(0)' }, OUT], [t + 700, { opacity: 1, transform: 'scaleX(1)' }], [end - 400 + i * 20, { opacity: 1, transform: 'scaleX(1)' }, INOUT], [end, { opacity: 0, transform: 'scaleX(1)' }]]);
  });
  // The two small segments carry their names below.
  A.split.forEach(([label, n], i) => {
    if (n > 6) return;
    const left = 90 + A.split.slice(0, i).reduce((sum, [, m]) => sum + (width * m) / total + 8, 0);
    const tag = node('div', 'matrix-label', layer, label);
    Object.assign(tag.style, { left: `${left}px`, top: '528px', fontSize: '13px' });
    life(tag, turn + 1500 + i * 120, end, { from: { y: -6 }, blur: 4 });
  });
  const tech = node('div', 'tech', layer);
  A.tech.forEach((label, i) => life(node('span', 'chip glass mono', tech, label), turn + 2300 + i * 130, end - 100 + i * 10 - 60, { from: { y: 16, s: 0.95 }, blur: 6, inDur: 560, outDur: 360 }));
  tech.style.top = '590px';
}

// ---------------------------------------------------------------------------
// 8 · 06 Languages and AI search (67.8 – 75.2 s)
// ---------------------------------------------------------------------------
function buildLanguages() {
  const [start, end] = S.languages;
  const L = FILM.languages;
  const layer = node('section', 'layer persp');
  // A wide strip: the header and the opening section of the homepage.
  const { box, view, url } = frame(layer, 90, 130, 1420, 361, 'example.com/');
  track(box, [
    [start, { opacity: 0, transform: pose({ y: 50, z: -120, rx: 14 }), filter: 'blur(12px)' }, OUT],
    [start + 800, { opacity: 1, transform: pose({ rx: 3 }), filter: 'blur(0px)' }, 'linear'],
    [end - 500, { opacity: 1, transform: pose({ rx: 0 }), filter: 'blur(0px)' }, INOUT],
    [end, { opacity: 0, transform: pose({ y: -30, s: 0.97 }), filter: 'blur(8px)' }],
  ]);
  const step = 1500;
  const first = start + 600;
  L.langs.forEach(([code], i) => {
    const img = picture(`assets/lang/home-${code}.png`, view);
    Object.assign(img.style, { width: '1420px', height: '887px', objectFit: 'fill' });
    const t = first + i * step;
    track(img, i === 0 ? [[0, { opacity: 1 }], [1, { opacity: 1 }]] : [[t, { opacity: 0, filter: 'blur(8px)', transform: 'translateY(10px)' }, OUT], [t + 420, { opacity: 1, filter: 'blur(0px)', transform: 'translateY(0px)' }]]);
  });
  const active = (t) => clamp(Math.floor((t - first) / step), 0, L.langs.length - 1);

  const code = node('div', 'code glass', layer);
  const lines = [
    () => `<span class="t">&lt;html</span> <span class="a">lang</span>=<span class="s">"${L.langs[0][0]}"</span><span class="t">&gt;</span>`,
    () => '  <span class="t">&lt;header&gt;</span>…<span class="t">&lt;/header&gt;</span>',
    () => '  <span class="t">&lt;nav&gt;</span>…<span class="t">&lt;/nav&gt;</span>',
    () => '  <span class="t">&lt;main&gt;</span>',
    () => '    <span class="t">&lt;h1&gt;</span>One heading per page<span class="t">&lt;/h1&gt;</span>',
    () => '    <span class="t">&lt;section&gt;</span>…<span class="t">&lt;/section&gt;</span>  <span class="c">&lt;!-- rendered on the server --&gt;</span>',
    () => '  <span class="t">&lt;/main&gt;</span>',
  ];
  life(code, start + 500, end, { from: { y: 30, rx: -14 }, exit: { y: -16 }, blur: 10 });
  lines.forEach((line, i) => {
    const row = node('div', '', code, line());
    const t = start + 900 + i * 260;
    track(row, [[t, { clipPath: 'inset(0 100% 0 0)' }, 'cubic-bezier(0.4, 0, 0.2, 1)'], [t + 500, { clipPath: 'inset(0 0% 0 0)' }]]);
  });
  const langValue = code.querySelector('.s');

  const copy = node('div', 'lang-copy', layer);
  const h2 = node('div', 'h2', copy);
  rise(splitInto(h2, L.head, 'word'), start + 700, 80, [end - 500, end - 150], { y: 0.4, blur: 8, duration: 620 });
  const p = node('p', 'lead', copy, L.sub);
  life(p, start + 1100, end, { from: { y: 12 }, blur: 6 });

  const chips = node('div', 'lang-chips', layer);
  L.langs.forEach(([, label]) => node('span', 'lang-chip', chips, label));
  life(chips, start + 1300, end, { from: { y: 12 }, blur: 4 });
  custom.push((t) => {
    const i = active(t);
    [...chips.children].forEach((chip, n) => chip.classList.toggle('on', n === i));
    const lang = L.langs[i][0];
    langValue.textContent = `"${lang}"`;
    url.textContent = lang === 'en' ? 'example.com/' : `example.com/${lang}/`;
  });
}

// ---------------------------------------------------------------------------
// 10 · End card (80.8 – 89.0 s)
// ---------------------------------------------------------------------------
function buildEnd() {
  const [start, end] = S.end;
  const E = FILM.end;
  const layer = node('section', 'layer end');
  const brand = node('div', 'end-brand', layer, '<span class="mark" style="--size:56px"><svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="46" pathLength="100" stroke-dasharray="100" /></svg><span class="dot"></span></span>Desiderio');
  life(brand, start + 200, null, { from: { y: 16 }, blur: 8 });
  track(brand.querySelector('circle'), [[start + 200, { strokeDashoffset: 100 }, OUT], [start + 1200, { strokeDashoffset: 0 }]]);
  const head = node('h1', 'end-head', layer);
  rise(splitInto(head, E.head, 'word'), start + 600, 95, null, { y: 0.42, blur: 12, duration: 720 });
  const plans = node('div', 'plans', layer);
  E.plans.forEach(([name, price, note], i) => {
    const card = node('div', 'plan glass', plans, `<small>${name}</small><b>${price}</b><span>${note}</span>`);
    life(card, start + 2100 + i * 150, null, { from: { y: 40, rx: -20, s: 0.96 }, blur: 10, inDur: 800 });
  });
  const cta = node('div', 'cta', layer, `${E.cta}<i></i>`);
  life(cta, start + 3300, null, { from: { y: 12 }, blur: 6 });
  track(cta.querySelector('i'), [[start + 3800, { transform: 'scaleX(0)' }, OUT], [start + 4700, { transform: 'scaleX(1)' }]]);
  const fade = node('div', 'blackout');
  track(fade, [[end - 1300, { opacity: 0 }, SOFT], [end, { opacity: 1 }]]);
}

// ---------------------------------------------------------------------------
// One caption per narration line, shown while the line is spoken. The lines
// and their real lengths come from Build/Scripts/generate-film-audio.mjs.
// ---------------------------------------------------------------------------
async function subtitles() {
  let lines = [];
  try { lines = (await (await fetch('audio/narration.json')).json()).lines ?? []; } catch { lines = []; }
  for (const line of lines) {
    const caption = node('div', 'subtitle', stage, line.show);
    const t0 = Math.max(0, line.at - 60);
    const t1 = Math.min(FILM.duration, line.at + line.duration + 240);
    track(caption, [[t0, { opacity: 0 }, OUT], [t0 + 180, { opacity: 1 }], [t1 - 180, { opacity: 1 }, INOUT], [t1, { opacity: 0 }]]);
  }
}

window.POSTER_AT = FILM.poster;
window.seek = (t) => {
  for (const animation of document.getAnimations()) animation.currentTime = t;
  for (const update of custom) update(t);
};
window.ready = (async () => {
  await Promise.all(['640 140px "Inter Variable"', '500 18px "JetBrains Mono Variable"'].map((font) => document.fonts.load(font)));
  buildNumerals();
  buildOpen();
  buildTitle();
  buildSix(S.index, { head: FILM.six.head });
  buildElements();
  buildPresets();
  buildEditing();
  buildExtensions();
  buildA11y();
  buildLanguages();
  buildSix(S.recap, { head: FILM.six.recap, checks: true });
  buildEnd();
  buildHud();
  node('div', 'vignette');
  await subtitles();
  await document.fonts.ready;
  await Promise.all([...document.images].map((img) => img.decode().catch(() => {})));
  window.seek(0);
  return FILM.duration;
})();
const hold = location.hash.match(/^#t=(\d+)/);
if (hold) window.ready.then(() => window.seek(Number(hold[1])));
if (location.hash === '#play') {
  window.ready.then((duration) => {
    const begin = performance.now();
    const tick = () => { window.seek((performance.now() - begin) % duration); requestAnimationFrame(tick); };
    requestAnimationFrame(tick);
  });
}
