<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      xmlns:cb="http://typo3.org/ns/TYPO3/CMS/ContentBlocks/ViewHelpers"
      xmlns:d="http://typo3.org/ns/Webconsulting/Desiderio/Components/ComponentCollection"
      data-namespace-typo3-fluid="true">

<f:asset.css identifier="d-company-values" href="{cb:assetPath()}/frontend.css"/>

<d:layout.section frame="{data.frame_class}" spaceBefore="{data.space_before_class}" spaceAfter="{data.space_after_class}" class="company-values">
    <d:layout.container>
        <f:if condition="{data.eyebrow} || {data.header} || {data.subheadline}">
            <d:molecule.sectionIntro prefix="company-values" class="company-values__intro">
                <f:fragment name="eyebrow"><f:if condition="{data.eyebrow}">{data -> f:render.text(field: 'eyebrow')}</f:if></f:fragment>
                <f:fragment name="heading"><f:if condition="{data.header}">{data -> f:render.text(field: 'header')}</f:if></f:fragment>
                <f:fragment name="lead"><f:if condition="{data.subheadline}">{data -> f:render.text(field: 'subheadline')}</f:if></f:fragment>
            </d:molecule.sectionIntro>
        </f:if>

        <div class="company-values__grid">
            <f:for each="{data.value_items}" as="value">
                <d:molecule.card class="company-values__item">
                    <div class="company-values__heading">
                        <f:if condition="{value.icon}"><span class="company-values__icon" aria-hidden="true"><d:atom.icon name="{value.icon}" size="md"/></span></f:if>
                        <d:atom.typography tag="h3" variant="large" class="company-values__title">{value -> f:render.text(field: 'title')}</d:atom.typography>
                    </div>
                    <f:if condition="{value.description}"><div class="company-values__description d-richtext">{value -> f:render.text(field: 'description')}</div></f:if>
                </d:molecule.card>
            </f:for>
        </div>
    </d:layout.container>
</d:layout.section>

</html>
