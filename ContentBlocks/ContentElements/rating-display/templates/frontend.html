<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      xmlns:cb="http://typo3.org/ns/TYPO3/CMS/ContentBlocks/ViewHelpers"
      xmlns:d="http://typo3.org/ns/Webconsulting/Desiderio/Components/ComponentCollection"
      data-namespace-typo3-fluid="true">

<f:asset.css identifier="d-rating-display" href="{cb:assetPath()}/frontend.css"/>

<d:layout.section frame="{data.frame_class}" spaceBefore="{data.space_before_class}" spaceAfter="{data.space_after_class}" class="rating-display">
    <d:layout.container>
        <f:if condition="{data.eyebrow} || {data.header}">
            <header class="rating-display__intro">
                <f:if condition="{data.eyebrow}">
                    <span class="rating-display__eyebrow">{data -> f:render.text(field: 'eyebrow')}</span>
                </f:if>
                <f:if condition="{data.header}">
                    <d:atom.typography tag="h2" variant="h2" class="rating-display__headline">{data -> f:render.text(field: 'header')}</d:atom.typography>
                </f:if>
            </header>
        </f:if>

        <ul class="rating-display__grid" role="list">
            <f:for each="{data.rating_items}" as="rating">
                <li class="rating-display__item">
                    <article class="rating-display__card">
                        <f:if condition="{rating.logo}">
                            <div class="rating-display__logo">
                                <f:for each="{rating.logo}" as="fileReference">
                                    <f:image image="{fileReference}" maxWidth="240" alt="{rating.platform}" loading="lazy" class="rating-display__logo-img" decoding="async"/>
                                </f:for>
                            </div>
                        </f:if>
                        <p class="rating-display__score">{rating -> f:render.text(field: 'score')}</p>
                        <div class="rating-display__stars" aria-hidden="true">
                            <f:for each="{0: 1, 1: 2, 2: 3, 3: 4, 4: 5}" as="star">
                                <d:atom.icon name="star" size="default" class="rating-display__star" />
                            </f:for>
                        </div>
                        <d:atom.typography tag="h3" variant="h3" class="rating-display__platform">{rating -> f:render.text(field: 'platform')}</d:atom.typography>
                        <f:if condition="{rating.review_count}">
                            <span class="rating-display__count">{rating -> f:render.text(field: 'review_count')}</span>
                        </f:if>
                        <f:if condition="{rating.link.url}">
                            <d:atom.link href="{f:uri.typolink(parameter: rating.link.url)}" target="{rating.link.target}" variant="muted" class="rating-display__link">
                                <span aria-hidden="true"><f:translate key="LLL:EXT:desiderio/Resources/Private/Language/labels.xlf:view_reviews" default="View reviews"/> &rarr;</span>
                                <span class="sr-only"><f:translate key="LLL:EXT:desiderio/Resources/Private/Language/labels.xlf:view_reviews.sr" arguments="{0: rating.platform}">View {rating.platform} reviews</f:translate></span>
                            </d:atom.link>
                        </f:if>
                    </article>
                </li>
            </f:for>
        </ul>
    </d:layout.container>
</d:layout.section>
</html>
