<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      xmlns:cb="http://typo3.org/ns/TYPO3/CMS/ContentBlocks/ViewHelpers"
      xmlns:d="http://typo3.org/ns/Webconsulting/Desiderio/Components/ComponentCollection"
      data-namespace-typo3-fluid="true">

<f:asset.css identifier="d-feature-minimal" href="{cb:assetPath()}/frontend.css"/>

<d:layout.section frame="{data.frame_class}" spaceBefore="{data.space_before_class}" spaceAfter="{data.space_after_class}" class="feature-minimal">
    <d:layout.container>
        <div class="feature-minimal__layout">
            <d:molecule.sectionIntro prefix="feature-minimal" class="feature-minimal__intro" leadVariant="lead" leadClass="feature-minimal__subheadline">
                <f:fragment name="heading"><f:if condition="{data.header}">{data -> f:render.text(field: 'header')}</f:if></f:fragment>
                <f:fragment name="lead"><f:if condition="{data.subheadline}">{data -> f:render.text(field: 'subheadline')}</f:if></f:fragment>
            </d:molecule.sectionIntro>
            <ul class="feature-minimal__list" role="list">
                <f:for each="{data.items}" as="item">
                    <li class="feature-minimal__item">
                        <d:atom.typography tag="h3" variant="large" class="feature-minimal__title">{item -> f:render.text(field: 'title')}</d:atom.typography>
                        <f:if condition="{item.description_text}">
                            <d:atom.typography variant="muted" class="feature-minimal__description">{item -> f:render.text(field: 'description_text')}</d:atom.typography>
                        </f:if>
                    </li>
                </f:for>
            </ul>
        </div>
    </d:layout.container>
</d:layout.section>

</html>
