<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      xmlns:cb="http://typo3.org/ns/TYPO3/CMS/ContentBlocks/ViewHelpers"
      xmlns:d="http://typo3.org/ns/Webconsulting/Desiderio/Components/ComponentCollection"
      data-namespace-typo3-fluid="true">

<f:asset.css identifier="d-accordion" href="{cb:assetPath()}/frontend.css"/>

<d:layout.section frame="{data.frame_class}" spaceBefore="{data.space_before_class}" spaceAfter="{data.space_after_class}" class="accordion-section">
    <d:layout.container size="md">
        <f:if condition="{data.header}">
            <d:atom.typography tag="h2" variant="h2" class="accordion-section__headline">{data -> f:render.text(field: 'header')}</d:atom.typography>
        </f:if>

        <f:variable name="groupName" value="{f:if(condition: data.allow_multiple, then: '', else: 'accordion-{data.uid}')}"/>

        <div class="accordion" data-d-accordion>
            <f:for each="{data.items}" as="item" iteration="iter">
                <details class="accordion__item" name="{groupName}" {f:if(condition: item.open_by_default, then: 'open')}>
                    <summary class="accordion__trigger">
                        <d:atom.typography tag="h3" variant="h3" class="accordion__title">{item -> f:render.text(field: 'title')}</d:atom.typography>
                        <span class="accordion__icon" aria-hidden="true">
                            <d:atom.icon name="chevron-down" size="sm" />
                        </span>
                    </summary>
                    <div class="accordion__content">
                        {item -> f:render.text(field: 'content')}
                    </div>
                </details>
            </f:for>
        </div>
    </d:layout.container>
</d:layout.section>

</html>
