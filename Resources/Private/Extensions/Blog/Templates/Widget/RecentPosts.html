<html
    xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
    xmlns:blogvh="http://typo3.org/ns/T3G/AgencyPack/Blog/ViewHelpers"
    xmlns:d="http://typo3.org/ns/Webconsulting/Desiderio/Components/ComponentCollection"
    data-namespace-typo3-fluid="true"
>

<f:layout name="Widget" />

<f:section name="Title"><f:translate extensionName="Blog" key="headline.recentposts">Recent posts</f:translate></f:section>

<f:section name="Content">
    <f:if condition="{posts}">
        <f:then>
            <ul role="list" class="flex flex-col gap-1">
                <f:for each="{posts}" as="post">
                    <li data-blog-post="{post.uid}">
                        <blogvh:link.post post="{post}" title="{post.title}" class="group/post -mx-2 flex flex-col gap-0.5 rounded-md px-2 py-2 !no-underline transition-colors duration-200 hover:bg-muted/70 focus-visible:outline-none focus-visible:ring-3 focus-visible:ring-ring/40">
                            <span class="line-clamp-2 text-sm font-medium leading-snug text-foreground transition-colors duration-200 group-hover/post:text-link">{post.title}</span>
                            <time class="text-xs text-muted-foreground" datetime="{f:format.date(format: 'c', date: post.publishDate)}">{f:format.date(pattern: 'MEDIUMDATE', date: post.publishDate)}</time>
                        </blogvh:link.post>
                    </li>
                </f:for>
            </ul>
        </f:then>
        <f:else>
            <d:molecule.alert class="bg-muted/40">
                <d:atom.icon name="book-open" size="sm"/>
                <d:molecule.alertDescription><f:translate extensionName="Blog" key="list.no_posts.message">There are no posts yet.</f:translate></d:molecule.alertDescription>
            </d:molecule.alert>
        </f:else>
    </f:if>
</f:section>

</html>
