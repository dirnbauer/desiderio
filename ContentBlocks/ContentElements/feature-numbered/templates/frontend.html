<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      xmlns:cb="http://typo3.org/ns/TYPO3/CMS/ContentBlocks/ViewHelpers"
      xmlns:d="http://typo3.org/ns/Webconsulting/Desiderio/Components/ComponentCollection"
      data-namespace-typo3-fluid="true">

<f:asset.css identifier="d-feature-numbered" href="{cb:assetPath()}/frontend.css"/>

<d:layout.section frame="{data.frame_class}" spaceBefore="{data.space_before_class}" spaceAfter="{data.space_after_class}" class="feature-numbered">
    <d:layout.container>
        <f:if condition="{data.header}">
            <d:molecule.sectionIntro prefix="feature-numbered" align="center" leadVariant="lead" class="feature-numbered__intro" leadClass="feature-numbered__subheadline">
                <f:fragment name="heading">{data -> f:render.text(field: 'header')}</f:fragment>
                <f:fragment name="lead"><f:if condition="{data.subheadline}">{data -> f:render.text(field: 'subheadline')}</f:if></f:fragment>
            </d:molecule.sectionIntro>
        </f:if>

        <ol class="feature-numbered__grid">
            <f:for each="{data.items}" as="item" iteration="iter">
                <li class="feature-numbered__item">
                    <span class="feature-numbered__number" aria-hidden="true">{iter.cycle -> f:format.padding(padLength: 2, padString: '0', padType: 'left')}</span>
                    <d:atom.typography tag="h3" variant="large" class="feature-numbered__title">{item -> f:render.text(field: 'title')}</d:atom.typography>
                    <f:if condition="{item.description}">
                        <d:atom.typography tag="div" variant="muted" class="feature-numbered__description d-richtext">{item -> f:render.text(field: 'description')}</d:atom.typography>
                    </f:if>
                </li>
            </f:for>
        </ol>
    </d:layout.container>
</d:layout.section>

</html>
