<html
    xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
    xmlns:d="http://typo3.org/ns/Webconsulting/Desiderio/Components/ComponentCollection"
    data-namespace-typo3-fluid="true"
>

<f:layout name="Pages/Default"/>

<f:section name="Main">
    <f:comment>
        Inner pages use the shared page header directly below the breadcrumb.
        It stands down when the content renders the h1 itself (a news detail
        view, or an entry of lib.pageHeadingOwnedByContent), so the article's
        or plugin's own h1 leads instead.
    </f:comment>

    <d:organism.pageHeader page="{page}" newsDetailUid="{newsDetailUid}" headingOwnedByContent="{pageHeadingOwnedByContent}"/>

    <div class="desiderio-corporate-template">
        <d:layout.container size="xl" class="desiderio-corporate-template__container">
            <div class="desiderio-corporate-template__content">
                <f:render partial="Presets/ContentArea" arguments="{content: content.main}"/>
            </div>
        </d:layout.container>
    </div>
</f:section>

</html>
