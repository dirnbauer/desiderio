<html xmlns="http://www.w3.org/1999/xhtml" lang="en"
    xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
    xmlns:s="http://typo3.org/ns/ApacheSolrForTypo3/Solr/ViewHelpers"
    xmlns:d="http://typo3.org/ns/Webconsulting/Desiderio/Components/ComponentCollection"
    data-namespace-typo3-fluid="true"
>

<f:argument name="resultSet" type="object"/>

<f:section name="FacetsActive">
    <f:if condition="{resultSet.facets.used -> f:count()}">
        <div id="tx-solr-facets-in-use" class="flex flex-wrap items-center gap-2 rounded-lg border border-border bg-card px-4 py-3 text-sm text-card-foreground shadow-sm">
            <span class="font-medium text-muted-foreground"><f:translate key="solr.facets.narrowedBy" domain="desiderio.labels">Narrowed by</f:translate>:</span>
            <f:for each="{resultSet.facets.used}" as="facet">
                <f:for each="{facet.allFacetItems.selected}" as="item">
                    <d:atom.badge href="{s:uri.facet.removeFacetItem(facet: facet, facetItem: item)}" variant="outline" class="facet remove-facet-option solr-ajaxified h-7 rounded-full bg-background px-3 active:translate-y-px dark:border-input dark:bg-input/30 dark:hover:bg-input/50">
                        <span class="sr-only"><f:translate key="solr.facets.remove" domain="desiderio.labels">Remove filter</f:translate></span>
                        {facet.label}: {item.label}
                        <span aria-hidden="true">&#215;</span>
                    </d:atom.badge>
                </f:for>
            </f:for>
            <d:atom.badge href="{s:uri.facet.removeAllFacets()}" variant="secondary" class="solr-ajaxified h-7 rounded-full px-3 active:translate-y-px">
                <f:translate key="solr.facets.removeAll" domain="desiderio.labels">Remove all filters</f:translate>
            </d:atom.badge>
        </div>
    </f:if>
</f:section>

</html>
