<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" class="icon-root">
  <title>Blog – Modern: the newest post large, the others as cards</title>
  <style>
    .icon-root{color-scheme:light dark;color:CanvasText;--icon-color-accent:AccentColor}
    .tile{fill:Canvas}
    .edge{fill:none;stroke:color-mix(in srgb,currentColor 20%,Canvas);stroke-width:1.5}
    .card{fill:none;stroke:color-mix(in srgb,currentColor 35%,Canvas);stroke-width:1}
    .ink{fill:currentColor}
    .soft{fill:currentColor;opacity:.4}
    .faint{fill:currentColor;opacity:.14}
    .icon-signature{fill:var(--icon-color-accent)}
  </style>
  <rect class="tile" x="2" y="2" width="60" height="60" rx="8"/>
  <rect class="edge" x="2.75" y="2.75" width="58.5" height="58.5" rx="7.25"/>
  <rect class="ink" x="7" y="8" width="24" height="4" rx="1"/>
  <rect class="faint" x="7" y="14.5" width="30" height="4" rx="2"/>
  <rect class="ink" x="8" y="15.25" width="8" height="2.5" rx="1.25"/>
  <rect class="card" x="7.5" y="22.5" width="49" height="16" rx="2.5"/>
  <rect class="faint" x="9" y="24" width="24" height="13" rx="1.5"/>
  <rect class="icon-signature" x="36" y="25.5" width="6" height="2" rx="1"/>
  <rect class="ink" x="36" y="29.5" width="17" height="2.5" rx="1"/>
  <rect class="soft" x="36" y="33.5" width="13" height="1.5" rx=".75"/>
  <rect class="card" x="7.5" y="42.5" width="14" height="15" rx="2"/>
  <rect class="card" x="25" y="42.5" width="14" height="15" rx="2"/>
  <rect class="card" x="42.5" y="42.5" width="14" height="15" rx="2"/>
  <rect class="faint" x="9" y="44" width="11" height="6" rx="1"/>
  <rect class="faint" x="26.5" y="44" width="11" height="6" rx="1"/>
  <rect class="faint" x="44" y="44" width="11" height="6" rx="1"/>
  <rect class="ink" x="9" y="52" width="9" height="1.5" rx=".75"/>
  <rect class="ink" x="26.5" y="52" width="9" height="1.5" rx=".75"/>
  <rect class="ink" x="44" y="52" width="9" height="1.5" rx=".75"/>
  <rect class="soft" x="9" y="54.5" width="6" height="1.5" rx=".75"/>
  <rect class="soft" x="26.5" y="54.5" width="6" height="1.5" rx=".75"/>
  <rect class="soft" x="44" y="54.5" width="6" height="1.5" rx=".75"/>
</svg>
