# Shared child table for collections whose field definitions are identical.
# Consumers reference it with `foreign_table: desiderio_icon_card_link` plus
# shareAcrossTables/shareAcrossFields; their own `fields:` would be inert.
# Generated from benefit-cards by Build/Scripts/derive-collection-merge-map.php.
# Used by: benefit-cards, feature-carousel, feature-grid-3
name: desiderio/icon-card-link
table: desiderio_icon_card_link
prefixFields: false
labelField: icon
fields:
  -
    identifier: icon
    type: Select
    renderType: selectSingle
    label: 'LLL:EXT:desiderio/Resources/Private/Language/labels.xlf:icon_emoji'
    description: 'Semantic icon key rendered through the active shadcn icon library.'
    itemsProcessors:
      10:
        class: Webconsulting\Desiderio\DataHandling\IconItemsProcessor
  -
    identifier: title
    type: Textarea
    rows: 1
    label: 'LLL:EXT:desiderio/Resources/Private/Language/labels.xlf:title'
    required: true
  -
    identifier: description
    type: Textarea
    enableRichtext: true
    richtextConfiguration: desiderio
    label: 'LLL:EXT:desiderio/Resources/Private/Language/labels.xlf:description'
    rows: 2
  -
    identifier: link
    type: Link
    label: 'LLL:EXT:desiderio/Resources/Private/Language/labels.xlf:link'
