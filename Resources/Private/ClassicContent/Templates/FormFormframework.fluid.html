<html
    xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
    data-namespace-typo3-fluid="true"
>

<f:comment>
    The core Form element (EXT:form). Same wrapper as the forms inside Content
    Blocks (Molecule/FormRenderer), so ext:form's markup gets desiderio's form
    styling, and the same width as the Powermail element.
</f:comment>
<f:layout name="Default"/>

<f:section name="Main">
    <f:render partial="Header" arguments="{record: record}"/>
    <div class="desiderio-form mt-8 w-full max-w-2xl" data-slot="form">
        <f:cObject typoscriptObjectPath="tt_content.{data.CType}.20" data="{data}" table="tt_content"/>
    </div>
</f:section>

</html>
