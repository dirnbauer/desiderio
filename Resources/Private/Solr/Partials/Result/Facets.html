<html xmlns="http://www.w3.org/1999/xhtml" lang="en"
    xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
    xmlns:s="http://typo3.org/ns/ApacheSolrForTypo3/Solr/ViewHelpers"
    data-namespace-typo3-fluid="true"
>

<f:argument name="resultSet" type="object"/>

<f:section name="Facets">
    <div id="tx-solr-faceting" class="space-y-4">
        <f:comment>
            Reset is only offered once something is filtered — an always-visible
            "clear" is noise on a result list nobody narrowed yet.
        </f:comment>
        <f:if condition="{resultSet.facets.used -> f:count()}">
            <a href="{s:uri.facet.removeAllFacets()}" class="solr-ajaxified d-facet-reset">
                <f:translate key="solr.facet.reset" domain="desiderio.labels">Reset filters</f:translate>
            </a>
        </f:if>

        <s:facet.area.group groupName="main" facets="{resultSet.facets.available}">
            <div class="space-y-4">
                <f:for each="{areaFacets}" as="facet">
                    <div id="facet-accordion-{facet.name}">
                        <f:render partial="Facets/{facet.partialName}" arguments="{resultSet:resultSet, facet:facet}"/>
                    </div>
                </f:for>
            </div>
        </s:facet.area.group>
    </div>
</f:section>

</html>
