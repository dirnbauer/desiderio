<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"

      data-namespace-typo3-fluid="true">

<d:layout.section spacing="sm">
    <d:layout.container>
        <d:atom.typography tag="h2" variant="h2">{title -> f:format.htmlspecialchars()}</d:atom.typography>

</d:layout.section>

</html>
